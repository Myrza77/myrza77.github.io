      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderQuestionCard(q, idxLabel) {
      const userSel = userAnswers[q.id];
      const hasSel = userSel !== undefined;
      const isFav = userFavs.has(q.id);
      const isCorrect = hasSel && userSel.toUpperCase() === q.answer.toUpperCase();
      const showDetails = isEvaluated || hasSel;

      let cardClass = "card";
      if (showDetails) cardClass += " evaluated " + (isCorrect ? "is-correct" : "is-wrong");

      let optionsHtml = '<div class="options-list">';
      for (const [key, text] of Object.entries(q.options)) {
        const isSelected = hasSel && userSel.toUpperCase() === key.toUpperCase();
        const isRight = key.toUpperCase() === q.answer.toUpperCase();
        let optClass = "option-btn";
        let icon = key;
        if (showDetails) {
          if (isRight) { optClass += " correct-highlight"; icon = "✓"; }
          else if (isSelected) { optClass += " wrong-highlight"; icon = "✗"; }
        } else if (isSelected) {
          optClass += " selected";
        }
        const optReason = (showDetails && q.explanations && q.explanations[key])
          ? `<div class="opt-reason">${escapeHtml(q.explanations[key])}</div>`
          : "";
        optionsHtml += `
          <button class="${optClass}" onclick="selectOption(${q.id}, '${key}')">
            <span class="opt-key">${icon}</span>
            <div class="opt-content">
              <span class="opt-text">${escapeHtml(text)}</span>
              ${optReason}
            </div>
          </button>
        `;
      }
      optionsHtml += '</div>';

      let expHtml = "";
      if (showDetails) {
        const boxClass = isCorrect ? "success" : "danger";
        expHtml = `
          <div class="explanation-box ${boxClass}">
            <div style="font-weight:800; margin-bottom:6px; display:flex; justify-content:space-between;">
              <span>${isCorrect ? '✓ Doğru Yanıt!' : '✗ Yanlış Yanıt — Doğru Cevap: ' + q.answer}</span>
              <span>Şık Analizi & Neden Diğerleri Değil?</span>
            </div>
            <div style="white-space:pre-line;">${escapeHtml(q.explanation)}</div>
          </div>
        `;
      }

      return `
        <div class="${cardClass}" id="q-card-${q.id}">
          <div class="q-meta">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge badge-subject">${escapeHtml(idxLabel)} • ${escapeHtml(q.category)}</span>
            </div>
            <button class="btn-icon" style="width:30px; height:30px; font-size:14px;" onclick="toggleFav(${q.id})">
              ${isFav ? '⭐' : '☆'}
            </button>
          </div>
          <div class="q-text">${escapeHtml(q.question)}</div>
          ${optionsHtml}
          ${expHtml}
        </div>
      `;
    }

    function renderApp() {
      const container = document.getElementById("app");
      const footer = document.getElementById("footer-actions");

      if (currentMode === "guide") {
        let html = '<div class="card"><h2 style="font-size:18px; font-weight:800; margin-bottom:8px;">📖 Testteki Soruların Mantığı ve Diğer Şıklar Neden Yanlış? (18 Başlık)</h2><p style="font-size:13px; color:var(--text-muted);">Sınavdaki 30 sorunun konu bazlı çeldirici şık analizi:</p></div>';
        SUMMARY_TOPICS.forEach(([title, rightAns, body]) => {
          html += `
            <div class="card">
              <div style="font-size:15px; font-weight:800; color:var(--primary); margin-bottom:4px;">${escapeHtml(title)}</div>
              <div style="font-size:13px; font-weight:700; margin-bottom:6px;">✓ ${escapeHtml(rightAns)}</div>
              <div style="font-size:13px; color:var(--text); white-space:pre-line; line-height:1.55;">${escapeHtml(body)}</div>
            </div>
          `;
        });
        container.innerHTML = html;
        footer.innerHTML = `<button class="btn btn-primary btn-full" onclick="setMode('list')">🔥 Test Sorularına Dön</button>`;
        updateCounters();
        return;
      }

      const list = getFilteredQuestions();
      if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; padding:36px;"><p style="font-weight:700; margin-bottom:10px;">Bu filtrede soru bulunamadı.</p><button class="btn btn-primary" onclick="setFilter('week1')">30 Çıkmış Soruyu Göster</button></div>`;
        footer.innerHTML = "";
        updateCounters();
        return;
      }

      if (currentMode === "list") {
        let html = "";
        list.forEach((q, i) => { html += renderQuestionCard(q, `Soru ${i + 1}`); });
        container.innerHTML = html;
        footer.innerHTML = `
          <button class="btn btn-secondary" onclick="resetAllAnswers()">Sıfırla</button>
          <button class="btn btn-primary btn-full" onclick="finishTest()">
            Testi Bitir / Tüm Şık Analizlerini Gör
          </button>
        `;
      } else {
        if (cardCurrentIndex >= list.length) cardCurrentIndex = 0;
        const q = list[cardCurrentIndex];
        container.innerHTML = renderQuestionCard(q, `Soru ${cardCurrentIndex + 1} / ${list.length}`);
        footer.innerHTML = `
          <button class="btn btn-secondary" style="flex:1;" onclick="if(cardCurrentIndex>0){cardCurrentIndex--;renderApp();window.scrollTo(0,0);}">◄ Önceki</button>
          <button class="btn btn-primary" style="flex:1;" onclick="if(cardCurrentIndex<${list.length-1}){cardCurrentIndex++;renderApp();window.scrollTo(0,0);}else{finishTest();}">Sonraki ►</button>
        `;
      }
      updateCounters();
    }

    function openGridModal() {
      const list = getFilteredQuestions();
      const grid = document.getElementById("modal-grid");
      grid.innerHTML = "";
      list.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "q-jump-btn";
        const ans = userAnswers[q.id];
        if (ans !== undefined) {
          if (ans.toUpperCase() === q.answer.toUpperCase()) btn.classList.add("correct");
          else btn.classList.add("wrong");
        }
        btn.textContent = idx + 1;
        btn.onclick = () => {
          closeGridModal();
          if (currentMode === "card") { cardCurrentIndex = idx; renderApp(); }
          else {
            const el = document.getElementById("q-card-" + q.id);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        };
        grid.appendChild(btn);
      });
      document.getElementById("modal-overlay").style.display = "block";
    }

    function closeGridModal() { document.getElementById("modal-overlay").style.display = "none"; }

    renderApp();
  </script>
</body>
</html>
