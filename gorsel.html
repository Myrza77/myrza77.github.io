<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Görsel Programlama I - Mobil Sınav Portalı</title>
  <style>
    /* Safe-fallback polyfill for localStorage in mobile WebView or file:// */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #0f172a;
      --code-text: #f1f5f9;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --correct-border: #a7f3d0;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --wrong-border: #fecaca;
    }
    .dark {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --code-bg: #050811;
      --code-text: #e2e8f0;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: rgba(16, 185, 129, 0.4);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --wrong-border: rgba(244, 63, 94, 0.4);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      overflow-x: hidden;
      padding-bottom: 90px;
    }
    /* Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      backdrop-filter: blur(10px);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .title-box .icon {
      font-size: 22px;
      line-height: 1;
    }
    .title-box h1 {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      background: var(--border);
      color: var(--text);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .progress-pill {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.2);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }
    /* Filters Container */
    .filters-wrap {
      padding: 8px 12px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 6px;
    }
    .filters-wrap::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    /* Main Content */
    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-week { background: #e0e7ff; color: #3730a3; }
    .badge-test { background: #dbeafe; color: #1e40af; }
    .badge-fill { background: #d1fae5; color: #065f46; }
    .badge-code { background: #fef3c7; color: #92400e; }
    .badge-fav { background: #fef08a; color: #854d0e; cursor: pointer; }
    .dark .badge-week { background: #312e81; color: #c7d2fe; }
    .dark .badge-test { background: #1e3a8a; color: #bfdbfe; }
    .dark .badge-fill { background: #064e3b; color: #a7f3d0; }
    .dark .badge-code { background: #78350f; color: #fde68a; }

    .q-text {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 14px;
    }
    /* Code block */
    .code-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .code-header {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }
    .code-copy {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
    }
    .code-box pre {
      padding: 12px;
      margin: 0;
      overflow-x: auto;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      color: var(--code-text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* Options for Test */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
    }
    .option-btn:active {
      transform: scale(0.99);
    }
    .opt-key {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .opt-text {
      flex: 1;
      line-height: 1.4;
    }
    .option-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #065f46;
    }
    .dark .option-btn.correct {
      color: #6ee7b7;
    }
    .option-btn.correct .opt-key {
      background: var(--correct);
      color: #fff;
    }
    .option-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #991b1b;
    }
    .dark .option-btn.wrong {
      color: #fca5a5;
    }
    .option-btn.wrong .opt-key {
      background: var(--wrong);
      color: #fff;
    }
    /* Explanation Box */
    .explanation-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }
    .explanation-box.success {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #065f46;
    }
    .dark .explanation-box.success {
      color: #6ee7b7;
    }
    .explanation-box.danger {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: #991b1b;
    }
    .dark .explanation-box.danger {
      color: #fca5a5;
    }
    /* Fill-in-the-blank styling */
    .fill-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fill-input {
      width: 100%;
      padding: 14px;
      font-size: 16px; /* Prevents iOS auto-zoom! */
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      outline: none;
    }
    .fill-input:focus {
      border-color: var(--primary);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    /* Code writing question */
    .code-editor {
      width: 100%;
      height: 130px;
      padding: 12px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: Consolas, Monaco, monospace;
      outline: none;
      resize: vertical;
    }
    /* Fixed Bottom Nav */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 680px;
      margin: 0 auto;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      min-height: 44px;
    }
    .nav-btn.prev {
      background: var(--border);
      color: var(--text);
    }
    .nav-btn.next {
      background: var(--primary);
      color: #fff;
    }
    .nav-btn.fav {
      flex: 0 0 44px;
      background: var(--border);
      color: var(--text-muted);
      font-size: 18px;
    }
    .nav-btn.fav.active {
      background: #fef08a;
      color: #ca8a04;
    }
    .dark .nav-btn.fav.active {
      background: #854d0e;
      color: #fef08a;
    }
    /* Question Jump Drawer / Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      padding: 4px 0;
    }
    .q-jump-btn {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .q-jump-btn.current {
      border: 2px solid var(--primary);
    }
    .q-jump-btn.correct {
      background: var(--correct);
      color: #fff;
      border-color: var(--correct);
    }
    .q-jump-btn.wrong {
      background: var(--wrong);
      color: #fff;
      border-color: var(--wrong);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- SAFE LOCALSTORAGE POLYFILL FOR MOBILE (PREVENTS WHITE SCREEN ON FILE://) -->
  <script>
    (function() {
      try {
        var test = '__st_test__';
        window.localStorage.setItem(test, test);
        window.localStorage.removeItem(test);
      } catch(e) {
        console.warn('Storage sandboxed or file:// active. Polyfilling memory storage.');
        var mem = {};
        window.localStorage = {
          getItem: function(k) { return mem.hasOwnProperty(k) ? mem[k] : null; },
          setItem: function(k, v) { mem[k] = String(v); },
          removeItem: function(k) { delete mem[k]; },
          clear: function() { mem = {}; }
        };
      }
    })();
  </script>

  <!-- TOP HEADER -->
  <header>
    <div class="header-row">
      <div class="title-box">
        <span class="icon">🐍</span>
        <div>
          <h1>Görsel Programlama I</h1>
          <div style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Python Vize & Çıkmış Sorular (149 Soru)</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="progress-pill" id="btn-jump-modal" onclick="openGridModal()">
          <span id="header-counter">1 / 149</span>
          <span>▾</span>
        </button>
        <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" title="Karanlık/Aydınlık Mod">🌙</button>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </header>

  <!-- FILTER PILLS -->
  <div class="filters-wrap" id="filters-container">
    <button class="filter-btn active" onclick="setFilter('all', 0)">Tümü (149)</button>
    <button class="filter-btn" style="border-color:#ef4444; color:#ef4444; font-weight:800;" onclick="setFilter('cikmis', 0)">🔥 Çıkmış Sorular (30)</button>
    <button class="filter-btn" onclick="setFilter('test', 0)">Test (70)</button>
    <button class="filter-btn" onclick="setFilter('fill', 0)">Boşluk (35)</button>
    <button class="filter-btn" onclick="setFilter('code', 0)">Kod Yazma (14)</button>
    <button class="filter-btn" onclick="setFilter('wrong', 0)">✗ Yanlışlarım (<span id="wrong-count">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('fav', 0)">⭐ Favoriler (<span id="fav-count">0</span>)</button>
    <span style="display:inline-block; width:1px; height:18px; background:var(--border); margin:auto 4px;"></span>
    <button class="filter-btn" onclick="setFilter('week', 1)">1. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 2)">2. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 3)">3. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 4)">4. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 5)">5. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 6)">6. Hafta</button>
    <button class="filter-btn" onclick="setFilter('week', 7)">7. Hafta</button>
  </div>

  <!-- MAIN QUESTION DISPLAY -->
  <main id="app">
    <div class="card" id="q-card">
      <!-- Dynamic Question Content Injected by JS -->
    </div>
  </main>

  <!-- FIXED BOTTOM NAVIGATION -->
  <footer>
    <button class="nav-btn prev" onclick="prevQuestion()">◄ Önceki</button>
    <button class="nav-btn fav" id="btn-fav" onclick="toggleFav()" title="Favoriye Ekle">⭐</button>
    <button class="nav-btn next" onclick="nextQuestion()">Sonraki ►</button>
  </footer>

  <!-- QUESTION SELECTION MODAL (DRAWER) -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeGridModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">Sorular Listesi</div>
        <button class="btn-icon" onclick="closeGridModal()">✕</button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); display:flex; gap:12px; flex-wrap:wrap;">
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--correct);"></span> Doğru: <strong id="modal-correct-cnt">0</strong></span>
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--wrong);"></span> Yanlış: <strong id="modal-wrong-cnt">0</strong></span>
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--bg); border:1px solid var(--border);"></span> Çözülmedi: <strong id="modal-unanswered-cnt">149</strong></span>
      </div>
      <div class="grid-container" id="modal-grid">
        <!-- Injected by JS -->
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="resetAllAnswers()">Cevapları Sıfırla</button>
        <button class="btn btn-primary" style="flex:1;" onclick="closeGridModal()">Kapat</button>
      </div>
    </div>
  </div>

  <script>

]", "question": "sonuc = 17 % 5 işleminin çıktısı aşağıdakilerden hangisidir?", "code": "sonuc = 17 % 5", "options": {"A": "3", "B": "2", "C": "3.4", "D": "1"}, "answer": "B", "explanations": {"A": "Yanlış: 3, 17 // 5 (tam bölme) işleminin sonucudur.", "B": "Doğru: 17'nin 5'e bölümünden kalan (17 = 3*5 + 2) 2'dir.", "C": "Yanlış: 3.4, 17 / 5 işleminin sonucudur.", "D": "Yanlış: Kalan 1 değil 2'dir."}, "lang": "python"}, {"id": 1016, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 2 - Değişkenler & Operatörler [Orta]", "question": "metin = \"20\" ve carpim = metin * 3 kodunun çıktısı nedir?", "code": "metin = \"20\"\ncarpim = metin * 3\nprint(carpim)", "options": {"A": "60", "B": "202020", "C": "Hata verir", "D": "60.0"}, "answer": "B", "explanations": {"A": "Yanlış: \"20\" tırnak içinde bir string olduğu için matematiksel çarpma yapılmaz.", "B": "Doğru: Bir string tam sayı ile çarpıldığında metin yan yana o sayı kadar tekrarlanır: \"202020\".", "C": "Yanlış: String ile int çarpımı geçerlidir, tekrarlama yapar.", "D": "Yanlış: Sonuç float değil string'dir."}, "lang": "python"}, {"id": 1017, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 2 - Değişkenler & Operatörler [Zor]", "question": "print(4 + 3 ** 2 * 2) kodunun ekran çıktısı işlem önceliğine göre nedir?", "code": "print(4 + 3 ** 2 * 2)", "options": {"A": "22", "B": "98", "C": "40", "D": "162"}, "answer": "A", "explanations": {"A": "Doğru: Önce üs alma (3 ** 2 = 9), sonra çarpma (9 * 2 = 18), en son toplama (4 + 18 = 22) yapılır.", "B": "Yanlış: İşlem önceliğine dikkat edilmemiştir.", "C": "Yanlış: Önce toplama yapılmaz.", "D": "Yanlış: İşlem önceliği Üs -> Çarpma/Bölme -> Toplama/Çıkarma şeklindedir."}, "lang": "python"}, {"id": 1018, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 2 - Değişkenler & Operatörler [Zor]", "question": "Aşağıdaki değişken isimlerinden hangisi Python'un saklı anahtar sözcüğü (keyword) olduğu için değişken adı olarak kullanılamaz?", "code": null, "options": {"A": "sayi_for", "B": "while_sayac", "C": "class", "D": "deger1"}, "answer": "C", "explanations": {"A": "Geçerli: İçinde for geçse de tam adı sayi_for olduğu için keyword değildir.", "B": "Geçerli: while_sayac ayrılmış bir sözcük değildir.", "C": "Doğru: class Python'da sınıf tanımlamak için ayrılmış bir anahtar kelimedir (keyword), değişken adı olamaz.", "D": "Geçerli: Harfle başlayan kurallı bir değişken adıdır."}, "lang": "python"}, {"id": 1019, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 2 - Değişkenler & Operatörler [Zor]", "question": "Aşağıdaki kod çalıştırıldığında çıktısı ne olur?", "code": "a = 10\nb = 4\na += b * 2\nprint(a)", "options": {"A": "28", "B": "18", "C": "20", "D": "24"}, "answer": "B", "explanations": {"A": "Yanlış: Önce b * 2 hesaplanır (4 * 2 = 8), sonra a'ya eklenir.", "B": "Doğru: b * 2 = 8 olur; a += 8 ifadesi a = 10 + 8 = 18 sonucunu verir.", "C": "Yanlış: 10 + 8 = 18 eder.", "D": "Yanlış: İşlem sonucu 18'dir."}, "lang": "python"}, {"id": 1020, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 2 - Değişkenler & Operatörler [Zor]", "question": "Python'da çok satırlı blok yorumlar veya docstring yazmak için hangi tırnak yapısı kullanılır?", "code": null, "options": {"A": "Tek tırnak ' ... '", "B": "Üç çift tırnak \"\"\" ... \"\"\"", "C": "Ters tırnak ` ... `", "D": "Köşeli ayraç [ ... ]"}, "answer": "B", "explanations": {"A": "Yanlış: Tek tırnak tek satırlık string tanımlar.", "B": "Doğru: Üç çift tırnak \"\"\" ... \"\"\" (veya üç tek tırnak) çok satırlı yorum ve docstring için kullanılır.", "C": "Yanlış: Ters tırnak Python'da yorum için kullanılmaz.", "D": "Yanlış: Köşeli ayraç liste tanımlamak için kullanılır."}, "lang": "python"}, {"id": 2006, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 2 - Boşluk Doldurma", "question": "Python'da üs alma işlemi için ____________ operatörü kullanılır.", "code": null, "answer": "DOGRU", "official_answer": "**", "accepted": ["**"], "explanation": "Python'da kuvvet (üs) alma işlemi için çift yıldız (**) operatörü kullanılır (Örn: 5**3 = 125).", "lang": "python"}, {"id": 2007, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 2 - Boşluk Doldurma", "question": "Bir değişkenin tipinin ondalıklı sayı olduğunu belirten veri tipi ____________ olarak adlandırılır.", "code": null, "answer": "DOGRU", "official_answer": "float", "accepted": ["float"], "explanation": "Python'da kesirli / ondalıklı sayılar float veri tipi ile temsil edilir (Örn: 10.45).", "lang": "python"}, {"id": 2008, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 2 - Boşluk Doldurma", "question": "Python'da değişken isimleri asla bir ____________ ile başlayamaz.", "code": null, "answer": "DOGRU", "official_answer": "Rakam / Sayı", "accepted": ["rakam", "sayi", "sayı", "rakam / sayı", "rakam/sayı", "numara"], "explanation": "Değişkenler bir harf veya alt çizgi (_) ile başlamalıdır; asla bir rakam / sayı ile başlayamaz.", "lang": "python"}, {"id": 2009, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 2 - Boşluk Doldurma", "question": "x = 15 // 4 işleminin sonucu ____________ olur.", "code": "x = 15 // 4", "answer": "DOGRU", "official_answer": "3", "accepted": ["3"], "explanation": "// tam bölme operatörüdür. 15'in 4'e bölümünden tam kısım 3'tür (3.75'in tam kısmı).", "lang": "python"}, {"id": 2010, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 2 - Boşluk Doldurma", "question": "Python'da doğru ya da yanlış değerini tutan mantıksal veri tipi ____________ olarak adlandırılır.", "code": null, "answer": "DOGRU", "official_answer": "bool (Boolean)", "accepted": ["bool", "boolean", "bool (boolean)"], "explanation": "Sadece True veya False değerlerini alan mantıksal veri tipi bool (Boolean) sınıfıdır.", "lang": "python"}, {"id": 3003, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 2 - Klasik & Kod Yazma", "question": "Kenar uzunlukları sırasıyla kisa_kenar = 4 ve uzun_kenar = 9 olan bir dikdörtgenin alanını ve çevresini hesaplayıp iki ayrı değişkene atayan Python kodunu yazınız.", "code": null, "answer": "DOGRU", "solution_code": "kisa_kenar = 4\nuzun_kenar = 9\nalan = kisa_kenar * uzun_kenar\ncevre = 2 * (kisa_kenar + uzun_kenar)", "keywords": ["kisa_kenar", "uzun_kenar", "*"], "explanation": "Dikdörtgenin alanı kısa kenar ile uzun kenarın çarpımıdır (4 * 9 = 36). Çevresi ise iki kenarın toplamının 2 katıdır (2 * (4 + 9) = 26).", "lang": "python"}, {"id": 3004, "course": "gorsel_vize", "week": 2, "week_title": "Hafta 2: Değişkenler, Veri Tipleri, Operatörler ve Yorum Satırları", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 2 - Klasik & Kod Yazma", "question": "Aşağıdaki kod bloğundaki hatalı satırları belirleyip sebebini yazınız:", "code": "ad soyad = \"Ali\"\n2not = 90\nfiyat$ = 100", "answer": "DOGRU", "solution_code": "1) ad soyad: Değişken isimlerinde boşluk bırakılamaz (ad_soyad olmalıdır).\n2) 2not: Değişken isimleri rakamla başlayamaz (not2 olmalıdır).\n3) fiyat$: Değişkenlerde özel semboller ($ vb.) kullanılamaz.", "keywords": ["boşluk", "rakam", "özel"], "explanation": "Üç satır da hatalıdır: 1) Değişken adında boşluk olamaz. 2) Değişken adı rakamla (2) başlayamaz. 3) Değişken adında _ dışında özel karakter ($) bulunamaz.", "lang": "python"}, {"id": 1021, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Kolay]", "question": "Kullanıcıdan klavye aracılığıyla veri almak için kullanılan temel Python fonksiyonu hangisidir?", "code": null, "options": {"A": "read()", "B": "input()", "C": "scanf()", "D": "get()"}, "answer": "B", "explanations": {"A": "Yanlış: read() dosya okumak için kullanılır.", "B": "Doğru: Kullanıcıdan klavye ile veri girişi almak için input() fonksiyonu kullanılır.", "C": "Yanlış: scanf() C dilinde kullanılır.", "D": "Yanlış: get() sözlük metodu olarak kullanılır."}, "lang": "python"}, {"id": 1022, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Kolay]", "question": "input() fonksiyonu kullanıcıdan aldığı veriyi varsayılan olarak hangi veri tipinde döndürür?", "code": null, "options": {"A": "int", "B": "float", "C": "str", "D": "bool"}, "answer": "C", "explanations": {"A": "Yanlış: Sayı girilse bile int() ile dönüştürülmedikçe str döner.", "B": "Yanlış: Varsayılan dönüş tipi float değildir.", "C": "Doğru: input() fonksiyonu girilen her veriyi varsayılan olarak karakter dizisi (str) tipinde döndürür.", "D": "Yanlış: bool döndürmez."}, "lang": "python"}, {"id": 1023, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Kolay]", "question": "print(\"Ali\", \"Veli\", \"Ayşe\") komutunda argümanların arasına boşluk yerine tire işareti (-) koymak için hangi parametre kullanılmalıdır?", "code": "print(\"Ali\", \"Veli\", \"Ayşe\")", "options": {"A": "end=\"-\"", "B": "sep=\"-\"", "C": "split=\"-\"", "D": "join=\"-\""}, "answer": "B", "explanations": {"A": "Yanlış: end parametresi sadece satır sonuna karakter ekler.", "B": "Doğru: sep (separator) parametresi argümanların arasına konulacak ayracı belirler: Ali-Veli-Ayşe.", "C": "Yanlış: print fonksiyonunun split parametresi yoktur.", "D": "Yanlış: print fonksiyonunun join parametresi yoktur."}, "lang": "python"}, {"id": 1024, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Orta]", "question": "Aşağıdaki kodun çıktısı nedir?", "code": "print(\"Pazartesi\", end=\"*\")\nprint(\"Salı\")", "options": {"A": "Pazartesi\n*Salı", "B": "Pazartesi*Salı", "C": "Pazartesi*\nSalı", "D": "Pazartesi Salı*"}, "answer": "B", "explanations": {"A": "Yanlış: end=\"*\" alt satıra geçmeyi engeller.", "B": "Doğru: İlk print alt satıra geçmek yerine sonuna * koyar ve ikinci print hemen yanına Salı yazar: Pazartesi*Salı.", "C": "Yanlış: İkinci print alt satıra geçmez, aynı satırda devam eder.", "D": "Yanlış: * işareti ilk kelimenin sonunda yer alır."}, "lang": "python"}, {"id": 1025, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Orta]", "question": "kelime = \"Programlama\" olduğuna göre len(kelime) fonksiyonunun döndüreceği değer kaçtır?", "code": "kelime = \"Programlama\"\nprint(len(kelime))", "options": {"A": "10", "B": "11", "C": "12", "D": "9"}, "answer": "B", "explanations": {"A": "Yanlış: P-r-o-g-r-a-m-l-a-m-a toplam 11 harftir.", "B": "Doğru: \"Programlama\" kelimesi 11 karakterden oluştuğu için len(kelime) 11 döndürür.", "C": "Yanlış: 11 karakter vardır.", "D": "Yanlış: 11 karakter vardır."}, "lang": "python"}, {"id": 1026, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Orta]", "question": "Kaçış dizilerinden (escape characters) \\t ne işe yarar?", "code": null, "options": {"A": "Alt satıra geçer", "B": "Bir sekme (tab) kadar yatay boşluk bırakır", "C": "Metni ters çevirir", "D": "Tırnak işaretini siler"}, "answer": "B", "explanations": {"A": "Yanlış: Alt satıra geçmek için \\n kullanılır.", "B": "Doğru: \\t kaçış dizisi metin içinde bir Tab (sekme) boyutu kadar yatay boşluk bırakır.", "C": "Yanlış: Metni ters çevirmez.", "D": "Yanlış: Tırnak silmez."}, "lang": "python"}, {"id": 1027, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Zor]", "question": "Kullanıcı klavyeden sırasıyla 10 ve 20 değerlerini girerse aşağıdaki kod ekrana ne yazar?", "code": "s1 = input(\"Sayı 1: \")\ns2 = input(\"Sayı 2: \")\nprint(s1 + s2)", "options": {"A": "30", "B": "1020", "C": "Hata verir", "D": "10 20"}, "answer": "B", "explanations": {"A": "Yanlış: int() dönüşümü yapılmadığı için matematiksel toplama yapılmaz.", "B": "Doğru: input() verileri str olarak alır; \"10\" + \"20\" string birleştirme işlemiyle \"1020\" sonucunu verir.", "C": "Yanlış: İki string + operatörüyle hatasız birleştirilir.", "D": "Yanlış: Arada boşluk olmadan yan yana birleştirilir."}, "lang": "python"}, {"id": 1028, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Zor]", "question": "print(\"A\", \"B\", \"C\", sep=\"\\n\") kodunun ekran çıktısı nasıldır?", "code": "print(\"A\", \"B\", \"C\", sep=\"\\n\")", "options": {"A": "A B C tek satırda", "B": "A\\nB\\nC", "C": "A, B ve C alt alta üç satırda", "D": "A-B-C"}, "answer": "C", "explanations": {"A": "Yanlış: Ayraç olarak \\n (yeni satır) verilmiştir.", "B": "Yanlış: \\n kaçış dizisi olduğu için ekrana \\n olarak basılmaz, alt satıra geçirir.", "C": "Doğru: sep=\"\\n\" her elemanın arasına yeni satır karakteri koyar; A, B ve C alt alta üç satırda yazılır.", "D": "Yanlış: Ayraç tire değil yeni satırdır."}, "lang": "python"}, {"id": 1029, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Zor]", "question": "Bir değişkenin türünü öğrenmek için kullanılan Python fonksiyonu aşağıdakilerden hangisidir?", "code": null, "options": {"A": "typeof()", "B": "type()", "C": "dtype()", "D": "check()"}, "answer": "B", "explanations": {"A": "Yanlış: typeof JavaScript'te kullanılır.", "B": "Doğru: Python'da bir değişkenin veya değerin veri tipini öğrenmek için type() fonksiyonu kullanılır.", "C": "Yanlış: dtype NumPy dizilerinde kullanılır.", "D": "Yanlış: Böyle bir yerleşik fonksiyon yoktur."}, "lang": "python"}, {"id": 1030, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 3 - Temel Fonksiyonlar & Giriş [Zor]", "question": "Klavyeden girilen bir ondalıklı sayıyı matematiksel işleme sokabilmek için hangi tip dönüştürme fonksiyonu kullanılmalıdır?", "code": null, "options": {"A": "int()", "B": "str()", "C": "float()", "D": "chr()"}, "answer": "C", "explanations": {"A": "Yanlış: int() tam sayıya çevirir, ondalıklı metinde ValueError verir.", "B": "Yanlış: str() metne çevirir.", "C": "Doğru: Ondalıklı sayı metnini sayısal ondalıklı tipe çevirmek için float() kullanılır.", "D": "Yanlış: chr() ASCII kodunu karaktere çevirir."}, "lang": "python"}, {"id": 2011, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 3 - Boşluk Doldurma", "question": "print() fonksiyonunda bir sonraki satıra geçmeyi engelleyip satır sonuna konulacak karakteri belirleyen parametre ____________ parametresidir.", "code": null, "answer": "DOGRU", "official_answer": "end", "accepted": ["end", "end="], "explanation": "print() fonksiyonunda varsayılan olarak end=\"\\n\" bulunur. Satır sonu karakterini değiştirmek için end parametresi kullanılır.", "lang": "python"}, {"id": 2012, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 3 - Boşluk Doldurma", "question": "Metin içinde imleci bir alt satırın başına indiren kaçış karakteri ____________ dizisidir.", "code": null, "answer": "DOGRU", "official_answer": "\\n", "accepted": ["\\n", "\"\\n\"", "'\\n'"], "explanation": "\\n (newline) kaçış karakteri metin içinde bir alt satıra geçmeyi sağlar.", "lang": "python"}, {"id": 2013, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 3 - Boşluk Doldurma", "question": "int(\"45\") komutunun yaptığı işleme tip ____________ adı verilir.", "code": "int(\"45\")", "answer": "DOGRU", "official_answer": "Dönüşümü (Type Casting)", "accepted": ["donusumu", "dönüşümü", "donusum", "dönüşüm", "donusturme", "dönüştürme", "type casting", "casting", "dönüşümü (type casting)"], "explanation": "Bir veri tipini başka bir veri tipine çevirme işlemine Tip Dönüşümü (Type Casting) denir.", "lang": "python"}, {"id": 2014, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 3 - Boşluk Doldurma", "question": "print() içerisinde birden fazla nesne arasına konulacak ayracı belirleyen parametre ____________ parametresidir.", "code": null, "answer": "DOGRU", "official_answer": "sep", "accepted": ["sep", "sep="], "explanation": "print() fonksiyonunda birden fazla argümanın arasına yerleştirilecek karakteri sep (separator) parametresi belirler.", "lang": "python"}, {"id": 2015, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 3 - Boşluk Doldurma", "question": "Bir karakter dizisinin (string) toplam karakter sayısını bulan fonksiyon ____________ fonksiyonudur.", "code": null, "answer": "DOGRU", "official_answer": "len", "accepted": ["len", "len()"], "explanation": "len() fonksiyonu bir dizginin (string) veya listenin eleman/karakter sayısını döndürür.", "lang": "python"}, {"id": 3005, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 3 - Klasik & Kod Yazma", "question": "Kullanıcıdan iki tam sayı alan, bu iki sayının toplamını ekrana \"Toplam: 45\" formatında yazdıran eksiksiz Python kodunu yazınız.", "code": null, "answer": "DOGRU", "solution_code": "s1 = int(input(\"Birinci sayıyı giriniz: \"))\ns2 = int(input(\"İkinci sayıyı giriniz: \"))\nprint(\"Toplam:\", s1 + s2)", "keywords": ["int(", "input(", "print(", "Toplam"], "explanation": "input() string döndürdüğü için iki girdi de int() ile tam sayıya çevrilmeli ve print(\"Toplam:\", s1 + s2) ile yazdırılmalıdır.", "lang": "python"}, {"id": 3006, "course": "gorsel_vize", "week": 3, "week_title": "Hafta 3: Temel Fonksiyonlar, Parametreler ve Veri Girişi", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 3 - Klasik & Kod Yazma", "question": "Ekrana tek bir print() fonksiyonu kullanarak şu çıktıyı veren kodu yazınız:", "code": "Adı: Ahmet\nSoyadı: Yılmaz\nBölüm: Bilgisayar", "answer": "DOGRU", "solution_code": "print(\"Adı: Ahmet\\nSoyadı: Yılmaz\\nBölüm: Bilgisayar\")", "keywords": ["print(", "\\n", "Ahmet", "Yılmaz"], "explanation": "Tek bir print() içinde alt satırlara geçmek için \\n kaçış dizisi (veya sep=\"\\n\") kullanılır.", "lang": "python"}, {"id": 1031, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Kolay]", "question": "Python'da iki değerin birbirine eşit olup olmadığını kontrol eden mantıksal karşılaştırma operatörü hangisidir?", "code": null, "options": {"A": "=", "B": "==", "C": "===", "D": "!="}, "answer": "B", "explanations": {"A": "Yanlış: = değer atama operatörüdür.", "B": "Doğru: == iki değerin birbirine eşit olup olmadığını kontrol eden ilişkisel operatördür.", "C": "Yanlış: === JavaScript'te kullanılır, Python'da yoktur.", "D": "Yanlış: != eşit değildir operatörüdür."}, "lang": "python"}, {"id": 1032, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Kolay]", "question": "Bir if koşulu sağlanmadığında alternatif bir koşulu denetlemek için hangi anahtar kelime kullanılır?", "code": null, "options": {"A": "else if", "B": "elif", "C": "then", "D": "case"}, "answer": "B", "explanations": {"A": "Yanlış: Python'da else if yerine kısaltması olan elif kullanılır.", "B": "Doğru: İlk if koşulu sağlanmadığında yeni bir koşul kontrol etmek için elif kullanılır.", "C": "Yanlış: Python'da then anahtar kelimesi yoktur.", "D": "Yanlış: if-else yapısında case kullanılmaz."}, "lang": "python"}, {"id": 1033, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Kolay]", "question": "Belirli bir koşul True (Doğru) olduğu sürece blok içerisindeki kodları tekrar tekrar çalıştıran döngü yapısı hangisidir?", "code": null, "options": {"A": "for", "B": "while", "C": "repeat", "D": "loop"}, "answer": "B", "explanations": {"A": "Yanlış: for döngüsü bir dizi veya aralık üzerinde gezinmek içindir.", "B": "Doğru: Belirtilen koşul True olduğu sürece çalışan döngü while döngüsüdür.", "C": "Yanlış: Python'da repeat döngüsü yoktur.", "D": "Yanlış: Python'da loop anahtar kelimesi yoktur."}, "lang": "python"}, {"id": 1034, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Orta]", "question": "Aşağıdaki kod çalıştırıldığında ekran çıktısı ne olur?", "code": "notu = 65\nif notu >= 70:\n    print(\"Başarılı\")\nelif notu >= 50:\n    print(\"Geçti\")\nelse:\n    print(\"Kaldı\")", "options": {"A": "Başarılı", "B": "Geçti", "C": "Kaldı", "D": "Çıktı vermez"}, "answer": "B", "explanations": {"A": "Yanlış: 65 >= 70 koşulu False döner.", "B": "Doğru: İlk koşul sağlanmaz, elif notu >= 50 (65 >= 50) koşulu True olduğu için ekrana \"Geçti\" yazar.", "C": "Yanlış: elif bloğu çalıştığı için else bloğuna girilmez.", "D": "Yanlış: \"Geçti\" çıktısını verir."}, "lang": "python"}, {"id": 1035, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Orta]", "question": "x = 10 ve y = 20 olduğuna göre (x > 5) and (y < 15) mantıksal ifadesinin sonucu nedir?", "code": "x = 10\ny = 20\nprint((x > 5) and (y < 15))", "options": {"A": "True", "B": "False", "C": "None", "D": "Hata verir"}, "answer": "B", "explanations": {"A": "Yanlış: and operatöründe her iki koşul da True olmalıdır; y < 15 (20 < 15) False'tur.", "B": "Doğru: (10 > 5) True, (20 < 15) False olduğu için True and False -> False döner.", "C": "Yanlış: Mantıksal ifade bool döndürür.", "D": "Yanlış: Geçerli bir mantıksal ifadedir."}, "lang": "python"}, {"id": 1036, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Orta]", "question": "x = 1 iken başlayan while x < 4: döngüsünde x değişkeni her adımda 1 artırılmazsa ne meydana gelir?", "code": "x = 1\nwhile x < 4:\n    print(x)", "options": {"A": "Kod hata verir ve kapanır", "B": "Döngü hiç çalışmaz", "C": "Sonsuz döngü (infinite loop) oluşur", "D": "Döngü 1 kez çalışır ve biter"}, "answer": "C", "explanations": {"A": "Yanlış: Sözdizimi hatası yoktur.", "B": "Yanlış: 1 < 4 True olduğu için döngü başlar.", "C": "Doğru: x hep 1 kalacağı için x < 4 koşulu sonsuza kadar True olur ve sonsuz döngü (infinite loop) oluşur.", "D": "Yanlış: Koşul bozulmadığı sürece durmaz."}, "lang": "python"}, {"id": 1037, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Zor]", "question": "Aşağıdaki kod parçasının ekran çıktısı nedir?", "code": "sayac = 0\nwhile sayac < 6:\n    sayac += 2\nprint(sayac)", "options": {"A": "4", "B": "5", "C": "6", "D": "8"}, "answer": "C", "explanations": {"A": "Yanlış: sayac 4 iken sayac < 6 sağlandığı için bir kez daha 2 eklenir.", "B": "Yanlış: sayac двух'şer (2'şer) artmaktadır.", "C": "Doğru: sayac sırasıyla 2, 4, 6 olur. 6 olduğunda sayac < 6 (6 < 6) False döner, döngü biter ve ekrana 6 yazdırılır.", "D": "Yanlış: 6'da döngü koşulu bozulduğu için 8'e çıkmaz."}, "lang": "python"}, {"id": 1038, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Zor]", "question": "Aşağıdaki kod çalıştırıldığında ekrana kaç kez \"Döngü\" yazar?", "code": "i = 1\nwhile i <= 5:\n    if i == 3:\n        break\n    print(\"Döngü\")\n    i += 1", "options": {"A": "1", "B": "2", "C": "3", "D": "5"}, "answer": "B", "explanations": {"A": "Yanlış: i=1 ve i=2 için çalışır.", "B": "Doğru: i=1 ve i=2 için \"Döngü\" yazar; i=3 olduğunda break komutu print'ten önce döngüyü sonlandırır (toplam 2 kez).", "C": "Yanlış: i=3 iken print satırına gelmeden break çalışır.", "D": "Yanlış: break döngüyü 3'te kırar."}, "lang": "python"}, {"id": 1039, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Zor]", "question": "Aşağıdaki iç içe döngüde ekrana kaç kez yıldız (*) basılır?", "code": "i = 0\nwhile i < 2:\n    j = 0\n    while j < 3:\n        print(\"*\")\n        j += 1\n    i += 1", "options": {"A": "5", "B": "6", "C": "8", "D": "9"}, "answer": "B", "explanations": {"A": "Yanlış: Toplama değil çarpma kadar (2 * 3) döner.", "B": "Doğru: Dış döngü 2 kez (i=0, 1), iç döngü her seferinde 3 kez (j=0, 1, 2) çalışır: 2 x 3 = 6 kez * basılır.", "C": "Yanlış: 2 x 3 = 6'dır.", "D": "Yanlış: 2 x 3 = 6'dır."}, "lang": "python"}, {"id": 1040, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 4 - Koşullar & While [Zor]", "question": "a = True, b = False ise not a or not b ifadesinin mantıksal sonucu nedir?", "code": "a = True\nb = False\nprint(not a or not b)", "options": {"A": "False", "B": "True", "C": "0", "D": "None"}, "answer": "B", "explanations": {"A": "Yanlış: not b ifadesi not False -> True olduğu için or işlemi True döner.", "B": "Doğru: not a -> False, not b -> True olur. False or True işleminin sonucu True'dur.", "C": "Yanlış: Sonuç boolean True'dur.", "D": "Yanlış: Sonuç True'dur."}, "lang": "python"}, {"id": 2016, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 4 - Boşluk Doldurma", "question": "Mantıksal karşılaştırmalarda iki durumdan en az birinin doğru olması durumunda True döndüren bağlaç ____________ bağlacıdır.", "code": null, "answer": "DOGRU", "official_answer": "or", "accepted": ["or", "veya"], "explanation": "or (veya) mantıksal operatörü, koşullardan en az biri True olduğunda True döndürür.", "lang": "python"}, {"id": 2017, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 4 - Boşluk Doldurma", "question": "Eşit değil (farklıdır) anlamına gelen karşılaştırma operatörü ____________ simgesidir.", "code": null, "answer": "DOGRU", "official_answer": "!=", "accepted": ["!="], "explanation": "Python'da iki değerin birbirinden farklı (eşit değil) olduğunu kontrol etmek için != operatörü kullanılır.", "lang": "python"}, {"id": 2018, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 4 - Boşluk Doldurma", "question": "Python'da koşul veya döngü bloklarının başladığını belirten satırın sonuna ____________ işareti konulur.", "code": null, "answer": "DOGRU", "official_answer": "İki nokta (:)", "accepted": [":", "iki nokta", "iki nokta (:)", "iki nokta üst üste"], "explanation": "if, elif, else, while, for, def gibi blok başlatan satırların sonuna iki nokta (:) konulması zorunludur.", "lang": "python"}, {"id": 2019, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 4 - Boşluk Doldurma", "question": "Döngüyü belirlenen bir şartta tamamen sonlandırmak için ____________ komutu kullanılır.", "code": null, "answer": "DOGRU", "official_answer": "break", "accepted": ["break"], "explanation": "break komutu döngüyü anında kırar ve program akışını döngünün dışına çıkarır.", "lang": "python"}, {"id": 2020, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 4 - Boşluk Doldurma", "question": "Bir if-else yapısında hiçbir koşul sağlanmadığında en son devreye giren varsayılan blok ____________ bloğudur.", "code": null, "answer": "DOGRU", "official_answer": "else", "accepted": ["else", "else:"], "explanation": "Üstteki if ve elif koşullarının hiçbiri sağlanmadığında çalışan son blok else bloğudur.", "lang": "python"}, {"id": 3007, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 4 - Klasik & Kod Yazma", "question": "Kullanıcıdan bir tamsayı alan ve bu sayının tek mi yoksa çift mi olduğunu if-else yapısı kullanarak ekrana yazdıran Python kodunu yazınız.", "code": null, "answer": "DOGRU", "solution_code": "sayi = int(input(\"Sayıyı girin: \"))\nif sayi % 2 == 0:\n    print(\"Çift Sayı\")\nelse:\n    print(\"Tek Sayı\")", "keywords": ["if", "% 2", "else", "print"], "explanation": "Bir sayının 2'ye bölümünden kalan (sayi % 2) 0 ise sayı Çift, değilse Tek sayıdır.", "lang": "python"}, {"id": 3008, "course": "gorsel_vize", "week": 4, "week_title": "Hafta 4: Koşullu İfadeler ve While Döngüsü", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 4 - Klasik & Kod Yazma", "question": "while döngüsü kullanarak 1'den 10'a kadar (10 dahil) olan tamsayıları ekrana alt alta yazdıran programı yazınız.", "code": null, "answer": "DOGRU", "solution_code": "sayi = 1\nwhile sayi <= 10:\n    print(sayi)\n    sayi += 1", "keywords": ["while", "10", "print", "+="], "explanation": "Sayaç 1'den başlatılır, while sayi <= 10: koşuluyla her adımda ekrana yazılıp 1 artırılır.", "lang": "python"}, {"id": 1041, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Kolay]", "question": "Python'da listeler hangi ayraç sembolü kullanılarak tanımlanır?", "code": null, "options": {"A": "{ }", "B": "( )", "C": "[ ]", "D": "< >"}, "answer": "C", "explanations": {"A": "Yanlış: { } sözlük (dict) ve küme (set) için kullanılır.", "B": "Yanlış: ( ) demet (tuple) için kullanılır.", "C": "Doğru: Python'da listeler köşeli parantez [ ] kullanılarak tanımlanır.", "D": "Yanlış: < > veri yapısı tanımlamaz."}, "lang": "python"}, {"id": 1042, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Kolay]", "question": "renkler = [\"Mavi\", \"Kırmızı\", \"Sarı\"] listesinin ilk elemanına erişmek için hangi kod yazılmalıdır?", "code": "renkler = [\"Mavi\", \"Kırmızı\", \"Sarı\"]", "options": {"A": "renkler[1]", "B": "renkler[0]", "C": "renkler.first()", "D": "renkler[-0]"}, "answer": "B", "explanations": {"A": "Yanlış: renkler[1] ikinci eleman olan \"Kırmızı\"yı verir.", "B": "Doğru: Python'da indeksleme 0'dan başlar; ilk eleman renkler[0] ile alınır.", "C": "Yanlış: Listelerde first() metodu yoktur.", "D": "Yanlış: Standart ilk eleman erişimi renkler[0] şeklindedir."}, "lang": "python"}, {"id": 1043, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Kolay]", "question": "Bir listenin son elemanına negatif indisleme ile erişmek için hangi indeks numarası kullanılır?", "code": null, "options": {"A": "liste[0]", "B": "liste[-1]", "C": "liste[-last]", "D": "liste[end]"}, "answer": "B", "explanations": {"A": "Yanlış: liste[0] ilk elemanı verir.", "B": "Doğru: Sondan birinci (en son) elemana erişmek için -1 indeksi (liste[-1]) kullanılır.", "C": "Yanlış: Geçersiz sözdizimi.", "D": "Yanlış: Geçersiz sözdizimi."}, "lang": "python"}, {"id": 1044, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Orta]", "question": "sayilar = [10, 20, 30, 40, 50, 60] listesinde print(sayilar[2:5]) dilimlemesinin çıktısı nedir?", "code": "sayilar = [10, 20, 30, 40, 50, 60]\nprint(sayilar[2:5])", "options": {"A": "[20, 30, 40]", "B": "[30, 40, 50]", "C": "[30, 40, 50, 60]", "D": "[20, 30, 40, 50]"}, "answer": "B", "explanations": {"A": "Yanlış: 2. indeks 20 değil 30'dur.", "B": "Doğru: 2. indeksten başlar, 5. indekse kadar (5 dahil değil -> 2, 3 ve 4. indisler) alır: [30, 40, 50].", "C": "Yanlış: Bitiş indeksi (5) dilime dahil edilmez.", "D": "Yanlış: Başlangıç indeksi 2'dir (30)."}, "lang": "python"}, {"id": 1045, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Orta]", "question": "Bir listenin içinde belirli bir değerin bulunup bulunmadığını kontrol etmek için hangi operatör kullanılır?", "code": null, "options": {"A": "has", "B": "exists", "C": "in", "D": "with"}, "answer": "C", "explanations": {"A": "Yanlış: Python'da has operatörü yoktur.", "B": "Yanlış: exists operatörü yoktur.", "C": "Doğru: Bir elemanın listede yer alıp almadığını kontrol etmek için in üyelik operatörü kullanılır.", "D": "Yanlış: with bağlam yöneticisi (context manager) içindir."}, "lang": "python"}, {"id": 1046, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Orta]", "question": "dersler = [\"Matematik\", \"Fizik\"] listesine yeni bir eleman olarak sonuna \"Kimya\" eklemek için hangi metot kullanılır?", "code": "dersler = [\"Matematik\", \"Fizik\"]", "options": {"A": "dersler.append(\"Kimya\")", "B": "dersler.add(\"Kimya\")", "C": "dersler.push(\"Kimya\")", "D": "dersler.insert_end(\"Kimya\")"}, "answer": "A", "explanations": {"A": "Doğru: Listenin sonuna yeni bir eleman eklemek için append() metodu kullanılır.", "B": "Yanlış: add() küme (set) metodudur.", "C": "Yanlış: push() JavaScript dizilerinde kullanılır.", "D": "Yanlış: Böyle bir liste metodu yoktur."}, "lang": "python"}, {"id": 1047, "course": "gorsel_vize", "week": 5, "week_title": "Hafta 5: Listeler (List) ve Özellikleri", "qType": "test", "difficulty": "Zor", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 5 - Listeler [Zor]", "question": "Aşağıdaki kod çalıştırıldığında çıktısı ne olur?", "code": "veriler = [1, 2, 3, 4, 5, 6, 7, 8]\nprint(veriler[1:7:2])", "options": {"A": "[2, 4, 6]", "B": "[1, 3, 5]", "C": "[2, 4, 6, 8]", "D": "[3, 5, 7]"}, "answer": "A", "explanations": {"A": "Doğru: 1. indeksten (2) başlar, 7. indekse kadar 2'şer adımla (1, 3 ve 5. indeksler) elemanları alır: [2, 4, 6].", "B -while döngüsü yoktur."}, "lang": "python"}, {"id": 1052, "course": "gorsel_vize", "week": 6, "week_title": "Hafta 6: For Döngüsü ve Döngü Kontrol İfadeleri", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 6 - For Döngüsü [Kolay]", "question": "range(5) fonksiyonu hangi sayı dizisini üretir?", "code": "range(5)", "options": {"A": "1, 2, 3, 4, 5", "B": "0, 1, 2, 3, 4", "C": "0, 1, 2, 3, 4, 5", "D": "1, 2, 3, 4"}, "answer": "B", "explanations": {"A": "Yanlış: Başlangıç belirtilmezse 0'dan başlar ve 5 dahil edilmez.", "B": "Doğru: range(5) 0'dan başlayıp 5'e kadar (5 hariç) toplam 5 sayı üretir: 0, 1, 2, 3, 4.", "C": "Yanlış: Bitiş değeri (5) diziye dahil değildir.", "D": "Yanlış: 0'dan başlar."}, "lang": "python"}, {"id": 1053, "course": "gorsel_vize", "week": 6, "week_title": "Hafta 6: For Döngüsü ve Döngü Kontrol İfadeleri", "qType": "test", "difficulty": "Kolay", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 6 - For Döngüsü [Kolay]", "question": "Döngü içerisinde o anki adımı atlayıp doğrudan bir sonraki tura geçilmesini sağlayan anahtar kelime nedir?", "code": null, "options": {"A": "break", "B": "continue", "C": "pass", "D": "skip"}, "answer": "B", "explanations": {"A": "Yanlış: break döngüyü tamamen sonlandırır.", "B": "Doğru: continue komutu o anki adımı atlar ve döngünün bir sonraki turuna geçer.", "C": "Yanlış: pass hiçbir şey yapmadan alt satıra devam eder, turu atlamaz.", "D": "Yanlış: Python'da skip komutu yoktur."}, "lang": "python"}, {"id": 1054, "course": "gorsel_vize", "week": 6, "week_title": "Hafta 6: For Döngüsü ve Döngü Kontrol İfadeleri", "qType": "test", "difficulty": "Orta", "test_type": "Görsel Programlama I - Test Soruları", "category": "Hafta 6 - For Döngüsü [Orta]", "question": "range(2, 10, 3) ifadesi sırasıyla hangi sayıları üretir?", "code": "range(2, 10, 3)", "options": {"A": "2, 5, 8", "B": "2, 4, 6, 8, 10", "C": "3, 6, 9", "D": "2, 6, 10"}, "answ
