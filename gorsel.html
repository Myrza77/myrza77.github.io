return ifadesi olmayan fonksiyonlar çağrıldığında varsayılan olarak None değerini döndürür.", "lang": "python"}, {"id": 2035, "course": "gorsel_vize", "week": 7, "week_title": "Hafta 7: Fonksiyonlar (def ve return)", "qType": "fill", "difficulty": "Boşluk Doldurma", "test_type": "Görsel Programlama I - Boşluk Doldurma", "category": "Hafta 7 - Boşluk Doldurma", "question": "Fonksiyon dışındaki ana program seviyesinde tanımlanan ve her yerden erişilebilen değişkenlere ____________ değişken adı verilir.", "code": null, "answer": "DOGRU", "official_answer": "Global", "accepted": ["global", "küresel", "kuresel", "global (küresel)"], "explanation": "Ana program seviyesinde tanımlanan ve tüm fonksiyonlardan erişilebilen değişkenlere Global (Küresel) değişken denir.", "lang": "python"}, {"id": 3013, "course": "gorsel_vize", "week": 7, "week_title": "Hafta 7: Fonksiyonlar (def ve return)", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 7 - Klasik & Kod Yazma", "question": "Kendisine gönderilen iki sayının ortalamasını hesaplayıp sonucu return ile geri döndüren ortalama_hesapla(s1, s2) fonksiyonunu Python dilinde yazınız.", "code": null, "answer": "DOGRU", "solution_code": "def ortalama_hesapla(s1, s2):\n    return (s1 + s2) / 2", "keywords": ["def ortalama_hesapla", "return", "/ 2"], "explanation": "def ortalama_hesapla(s1, s2): ile fonksiyon tanımlanır ve (s1 + s2) / 2 ifadesi return ile döndürülür.", "lang": "python"}, {"id": 3014, "course": "gorsel_vize", "week": 7, "week_title": "Hafta 7: Fonksiyonlar (def ve return)", "qType": "code", "difficulty": "Klasik / Kod Yazma", "test_type": "Görsel Programlama I - Klasik & Kod Yazma", "category": "Hafta 7 - Klasik & Kod Yazma", "question": "Kendisine parametre olarak verilen bir listedeki en büyük sayıyı bulan (hazır max() fonksiyonunu kullanmadan döngüyle bulan) bir fonksiyon yazınız.", "code": null, "answer": "DOGRU", "solution_code": "def en_buyuk_bul(liste):\n    en_b = liste[0]\n    for eleman in liste:\n        if eleman > en_b:\n            en_b = eleman\n    return en_b", "keywords": ["def ", "for ", "if ", "return"], "explanation": "Listenin ilk elemanı (liste[0]) başlangıçta en büyük kabul edilir, for döngüsüyle tüm elemanlar gezilerek daha büyük bir eleman bulunduğunda güncellenir ve sonunda return edilir.", "lang": "python"}, {"id": 7001, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 1, "difficulty": "Kolay", "category": "Çıkmış Soru • Python'a Giriş (Kolay #1)", "question": "Yüksek seviyeli dil ile yazılmış programa kaynak kodu denir. Kaynak kodunun bilgisayar tarafından anlaşılabilmesi için makine diline dönüştürülmesi gerekir. Bu işi aşağıdakilerden hangisi gerçekleştirir?", "code": null, "options": {"A": "compiler", "B": "console", "C": "edit", "D": "format", "E": "debug"}, "answer": "A", "explanation": "İpucu: Derleyici (compiler), kaynak kodu derlemeden önce kodları kontrol eder, varsa hataları bildirir ve kodu makine diline dönüştürür."}, {"id": 7002, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 1, "difficulty": "Kolay", "category": "Çıkmış Soru • Python'a Giriş (Kolay #2)", "question": "Aşağıdakilerden hangisi \"Derleyici\" ve \"Yorumlayıcı\" arasındaki farklardan birisi değildir?", "code": null, "options": {"A": "Derleyici, tüm hatalar tek seferde belirlenerek çıktı verirken; Yorumlayıcı, karşılaşılan ilk hatada çalışmayı durdurur.", "B": "Derleyici, Yorumlayıcı'ya göre daha hızlıdır.", "C": "Derleyici, Yorumlayıcı'dan daha fazla bellek gerektirir.", "D": "Tüm diller derleyici kullanır.", "E": "Makine diline çevrilmiş programın çalışması yüksek seviyeli dillere göre daha hızlıdır."}, "answer": "D", "explanation": "İpucu: Tüm diller derleyici kullanmaz. C, C++ gibi diller derleyici kullanırken; Python, Ruby gibi diller yorumlayıcı (interpreter) kullanır."}, {"id": 7003, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Kolay", "category": "Çıkmış Soru • Veri Tipleri (Kolay #3)", "question": "Yukarıdaki Python ifadesinin sonucu nedir?", "code": "print(3 * 5 + (15 / 3) * 3 - 2)", "options": {"A": "30", "B": "28", "C": "29", "D": "20", "E": "58"}, "answer": "B", "explanation": "İpucu: İlk olarak parantez içi yapılır: (15 / 3) = 5. Ardından çarpmalar: 3 * 5 = 15 ve 5 * 3 = 15. Son olarak: 15 + 15 - 2 = 28."}, {"id": 7004, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Kolay", "category": "Çıkmış Soru • Veri Tipleri (Kolay #4)", "question": "Yukarıdaki kodun çıktısı nedir?", "code": "d = '7'\nm = '19'\nprint(int(d) + int(m))", "options": {"A": "26", "B": "12", "C": "Program hata verir.", "D": "133", "E": "2,7"}, "answer": "A", "explanation": "İpucu: String olarak tanımlanan '7' ve '19' ifadeleri int() fonksiyonu ile tam sayıya çevrilip toplandığında 7 + 19 = 26 sonucu elde edilir."}, {"id": 7005, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 3, "difficulty": "Kolay", "category": "Çıkmış Soru • Temel Fonksiyonlar (Kolay #5)", "question": "Bir öğrenci ekrana python yazdırmak istiyor. Fakat yazdırırken bir hata yapıyor ve yukarıdaki gibi yazıyor. Bu durumda ekranda hangi hata mesajı gözükür?", "code": "print(\"python)", "options": {"A": "SyntaxError: unexpected indent", "B": "SyntaxError: EOL while scanning string literal", "C": "SyntaxError: invalid syntax", "D": "SyntaxError: can't assign to literal", "E": "IndentationError: expected an indented block"}, "answer": "B", "explanation": "İpucu: String ifadenin kapanış tırnağı unutulduğunda yorumlayıcı satır sonuna (End Of Line - EOL) kadar tırnağı arar ve 'SyntaxError: EOL while scanning string literal' hatası verir."}, {"id": 7006, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 3, "difficulty": "Kolay", "category": "Çıkmış Soru • Temel Fonksiyonlar (Kolay #6)", "question": "Aşağıdakilerden hangisinde print() fonksiyonunun kullanımı doğrudur?", "code": null, "options": {"A": "print(\"Ankara)", "B": "print(Ankara)", "C": "print(\"\\n Ankara\")", "D": "print('Ankara\")", "E": "print(\"\"Ankara\"\"\")"}, "answer": "C", "explanation": "İpucu: print() komutunda açılış ve kapanış tırnakları eşleşmelidir (\"...\"). \\n ise alt satıra geçmek için kullanılan geçerli bir kaçış dizisidir."}, {"id": 7007, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 4, "difficulty": "Kolay", "category": "Çıkmış Soru • Koşullu İfadeler (Kolay #7)", "question": "Kullanıcıdan alınan 3 sayıdan hangisinin daha büyük olduğunu gösteren programı yazınız.", "code": null, "options": {"A": "a = int(input('a: '))\nb = int(input('b: '))\nc = int(input('c: '))\n\nif (a > b) and (a > c):\n    print('a en büyük sayıdır.')\nelif (b > a) and (b > c):\n    print('b en büyük sayıdır.')\nelif (c > a) and (c > b):\n    print('c en büyük sayıdır.')", "B": "a = int(input('a: '))\nb = int(input('b: '))\nc = int(input('c: '))\n\nif (a > b) or (a > c):\n    print('a en büyük sayıdır.')\nelif (b > a) or (b > c):\n    print('b en büyük sayıdır.')\nelif (c > a) or (c > b):\n    print('c en büyük sayıdır.')", "C": "a = (input('a: '))\nb = (input('b: '))\nc = (input('c: '))\n\nif (a > b) and (a > c):\n    print('a en büyük sayıdır.')\nelif (b > a) and (b > c):\n    print('b en büyük sayıdır.')\nelif (c > a) and (c > b):\n    print('c en büyük sayıdır.')", "D": "a = int(input('a: '))\nb = int(input('b: '))\nc = int(input('c: '))\n\nif (a > b) or (a > c) print('a en büyük sayıdır.')\nelif (b > a) or (b > c) print('b en büyük sayıdır.')\nelif (c > a) or (c > b) print('c en büyük sayıdır.')"}, "answer": "A", "explanation": "İpucu: Sayılar int(input()) ile tam sayıya çevrilmeli ve bir sayının en büyük olması için diğer İKİ sayıdan da büyük olması gerektiğinden 'and' bağlacı kullanılmalıdır."}, {"id": 7008, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 4, "difficulty": "Kolay", "category": "Çıkmış Soru • Koşullu İfadeler (Kolay #8)", "question": "Kullanıcıdan aldığınız (0'dan büyük) sayının çift olup olmadığını kontrol eden Python programını yazınız.", "code": null, "options": {"A": "sayi = int(input('Kontrol edilecek sayıyı giriniz:'))\nif (sayi > 0):\n    if (sayi % 2 == 0):\n        print('Girdiğiniz sayı çift sayıdır.')\n    if\n        print('Girdiğiniz sayı tek sayıdır.')", "B": "sayi = int(input('Kontrol edilecek sayıyı giriniz:'))\nif (sayi > 0):\n    if (sayi % 2 == 0):\n        print('Girdiğiniz sayı çift sayıdır.')\n    else:\n        print('Girdiğiniz sayı tek sayıdır.')", "C": "sayi = int(input('Kontrol edilecek sayıyı giriniz:'))\nif (sayi > 0):\n    if (sayi % 2 == 0):\n        print('Girdiğiniz sayı çift sayıdır.')\n    print('Girdiğiniz sayı tek sayıdır.')", "D": "sayi = int(input('Kontrol edilecek sayıyı giriniz:'))\nif (sayi % 2 == 0):\n    print('Girdiğiniz sayı çift sayıdır.')\nelse:\n    print('Girdiğiniz sayı tek sayıdır.')", "E": "sayi = int(input('Kontrol edilecek sayıyı giriniz:'))\nif (sayi > 0):\n    if (sayi % 2 == 0):\n        print('Girdiğiniz sayı çift sayıdır.')\n    else if:\n        print('Girdiğiniz sayı tek sayıdır.')"}, "answer": "B", "explanation": "İpucu: İç içe koşul yapısında sayi > 0 kontrolünden sonra sayi % 2 == 0 ise çift, aksi halde (else:) tek sayıdır."}, {"id": 7009, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 6, "difficulty": "Kolay", "category": "Çıkmış Soru • Döngü Yapıları (Kolay #9)", "question": "Yukarıdaki Sayilar listesindeki değerleri for döngüsü ile dönüp toplayan kod hangisidir?", "code": "Sayilar = [1, 2, 3, 4, 5, 6, 7]", "options": {"A": "Toplam = 0\nfor sayi in sayilar:\n    Toplam += sayi\nprint(\"Toplam : \", Toplam)", "B": "for sayi in sayilar:\n    Toplam += sayi\nprint(\"Toplam : \", Toplam)", "C": "Toplam = 0\nwhile sayi in sayilar:\n    Toplam += sayi\nprint(\"Toplam : \", Toplam)"}, "answer": "A", "explanation": "İpucu: Döngüden önce Toplam = 0 başlangıç değeri tanımlanmalı ve for döngüsü ile her eleman Toplam değişkenine eklenmelidir."}, {"id": 7010, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 4, "difficulty": "Kolay", "category": "Çıkmış Soru • Döngüler (Kolay #10)", "question": "Yukarıda verilen Python kodu ne işe yarıyor?", "code": "a = 50\ncarpim = 1\nwhile a < 100:\n    if (a % 5 == 0):\n        carpim = carpim * a\n    a += 1\nprint(carpim)", "options": {"A": "50 ve 100 arasındaki sayıları toplar.", "B": "50 ve 100 arasındaki 5'e bölünen sayıların çarpımı", "C": "50 ve 100 arasındaki 5'e bölünen sayıların toplamı", "D": "50 ve 100 arasındaki tek sayıların toplamını bulur.", "E": "50 ve 100 arasındaki çift sayıların toplamını bulur."}, "answer": "B", "explanation": "İpucu: Döngü 50'den 100'e kadar ilerlerken a % 5 == 0 koşuluyla 5'e tam bölünen sayıları carpim değişkeni ile çarpar. (Not: Orijinal cevap anahtarında sehven A yazılmış olsa da kod 5'e bölünenlerin çarpımını bulmaktadır)."}, {"id": 7011, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 1, "difficulty": "Orta", "category": "Çıkmış Soru • Python'a Giriş (Orta #1)", "question": "1. Daha fazla bellek gerektirir.\n2. Daha yavaştır.\n3. Hata ayıklamak zordur.\n\nYukarıda derleyici ve yorumlayıcı hakkında bilgiler vardır. Buna göre; hangi seçenekte derleyici ve yorumlayıcı sırası doğru verilmiştir?", "code": null, "options": {"A": "Derleyici - derleyici - yorumlayıcı", "B": "Yorumlayıcı - derleyici - derleyici", "C": "Derleyici - yorumlayıcı - derleyici", "D": "Yorumlayıcı - derleyici - yorumlayıcı", "E": "Derleyici - yorumlayıcı - yorumlayıcı"}, "answer": "C", "explanation": "İpucu: 1) Derleyici hedef makine kodu ürettiği için daha fazla bellek gerektirir. 2) Yorumlayıcı satır satır çalıştırdığı için daha yavaştır. 3) Derleyici tüm kodu tek seferde derlediği için hata ayıklamak yorumlayıcıya göre daha zordur (Derleyici - Yorumlayıcı - Derleyici)."}, {"id": 7012, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 1, "difficulty": "Orta", "category": "Çıkmış Soru • Python'a Giriş (Orta #2)", "question": "Aşağıdakilerden hangisi kod yazarken yorum satırı kullanma amaçlarından birisi değildir?", "code": null, "options": {"A": "Yazılan kod satırı ile ilgili bilgi vermek.", "B": "Kullanılmayan ya da sonrasında kullanılabilir hale getirmek için yazılan kod satırını görünmez kılmak.", "C": "Hatırlatma oluşturmak.", "D": "Proje bittikten sonra dönüp bakıldığında kodun okunabilirliğini korumasını sağlamak.", "E": "Keyfi olarak proje dışında eğlenme amaçlı yazmak."}, "answer": "E", "explanation": "İpucu: Yorum satırlarının amacı kod hakkında bilgi vermek, hatırlatma oluşturmak ve okunabilirliği artırmaktır; keyfi/eğlenme amaçlı kullanılmaz."}, {"id": 7013, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Orta", "category": "Çıkmış Soru • Veri Tipleri ve Operatörler (Orta #3)", "question": "Kullanıcıdan 1 vize ve 1 final notunu alıp ortalama hesaplayınız. Eğer ortalama 50 ve üstündeyse geçti (True) değilse kaldı (False) yazan programı yazınız. (NOT: Vize notu %60, final notu %40 etki etmektedir ve Ortalama 50 olsa bile final notu en az 50 olmalıdır.)", "code": null, "options": {"A": "vize = float(input('vize: '))\nfinal = float(input('final: '))\nortalama = (vize * 0.6) + (final * 0.4)\ngectiMi = (ortalama >= 50) and (final >= 50)\nprint('Öğrencinin ortalaması:', ortalama, 'Öğrenci geçti mi:', gectiMi)", "B": "vize = float(input('vize: '))\nfinal = float(input('final: '))\nortalama = (vize * 0.6) + (final * 0.4)\ngectiMi = (ortalama >= 50) or (final >= 50)\nprint('Öğrencinin ortalaması:', ortalama, 'Öğrenci geçti mi:', gectiMi)", "C": "vize = float(input('vize: '))\nfinal = float(input('final: '))\nortalama = (vize * 0.6) + (final * 0.4)\ngectiMi = (ortalama >= 50) and (final >= 50)\nprint('Öğrencinin ortalaması:' ortalama 'Öğrenci geçti mi:' gectiMi)", "D": "vize = float(input('vize: '))\nfinal = float(input('final: '))\nortalama = (vize * 0.6) + (final * 0.4)\ngectiMi = (ortalama => 50) and (final => 50)\nprint('Öğrencinin ortalaması:', ortalama, 'Öğrenci geçti mi:', gectiMi)"}, "answer": "A", "explanation": "İpucu: Hem ortalamanın >= 50 olması hem de finalin >= 50 olması zorunlu olduğundan 'and' operatörü ve '>=' karşılaştırması kullanılmalıdır."}, {"id": 7014, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 3, "difficulty": "Orta", "category": "Çıkmış Soru • Veri Tipleri (Orta #4)", "question": "Kullanıcıdan ad (string), yaş (integer) ve boy (float) bilgilerini uygun veri tipine dönüştürerek alarak aşağıdaki formatta ekrana yazdıran programı yazınız:\n\"Adınız: Ali, Yaşınız: 20, Boyunuz: 1.75 metre\"", "code": null, "options": {"A": "ad = input(\"Adınız: \")\nyas = int(input(\"Yaşınız: \"))\nboy = float(input(\"Boyunuz: \"))\nprint(\"Adınız:\", ad, \", Yaşınız:\", yas, \", Boyunuz:\", boy, \"metre\")", "B": "ad = str(input(\"Adınız: \"))\nyas = input(\"Yaşınız: \")\nboy = input(\"Boyunuz: \")\nprint(\"Adınız:\", ad, \", Yaşınız:\", yas, \", Boyunuz:\", boy, \"metre\")", "C": "ad = input(\"Adınız: \")\nyas = float(input(\"Yaşınız: \"))\nboy = int(input(\"Boyunuz: \"))\nprint(\"Adınız:\", ad, \", Yaşınız:\", yas, \", Boyunuz:\", boy, \"metre\")", "D": "ad = input(\"Adınız: \")\nyas = int(input(\"Yaşınız: \"))\nboy = float(input(\"Boyunuz: \"))\nprint(\"Adınız: \" + ad + \" Yaşınız: \" + yas + \" Boyunuz: \" + boy)"}, "answer": "A", "explanation": "İpucu: input() varsayılan olarak str döndürür; yaş için int(), boy için float() dönüşümü yapılmalı ve print() içinde virgülle ayrılarak yazdırılmalıdır."}, {"id": 7015, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 3, "difficulty": "Orta", "category": "Çıkmış Soru • Temel Fonksiyonlar (Orta #5)", "question": "Kullanıcıdan 2 adet sayı alın ve bunların toplamını bulan programı yazınız.", "code": null, "options": {"A": "a = input(\"Birinci sayi: \")\nb = input(\"İkinci sayi: \")\nprint(\"Toplam:\", a + b)", "B": "a = int(input(\"Birinci sayi: \"))\nb = int(input(\"İkinci sayi: \"))\nprint(\"Toplam:\", a + b)", "C": "a = int(input(Birinci sayi:))\nb = int(input(\"İkinci sayi\"))\nprint(\"Toplam:\", a + b)", "D": "a = (input(\"Birinci sayi: \"))\nb = (input(\"İkinci sayi\"))\nprint(\"Toplam: \" + a + b)", "E": "a = int((\"Birinci sayi: \"))\nb = int((\"İkinci sayi\"))\nprint(\"Toplam:\", a + b)"}, "answer": "B", "explanation": "İpucu: Sayısal toplama yapabilmek için input() ile alınan değerler int() fonksiyonu ile tam sayıya dönüştürülmelidir."}, {"id": 7016, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 3, "difficulty": "Orta", "category": "Çıkmış Soru • Temel Fonksiyonlar (Orta #6)", "question": "Kullanıcıdan iki sayı alınız. Aldığınız sayılardan birini x kenarına birini y kenarına atayınız ve oluşturduğunuz dik üçgenin hipotenüsünü hesaplayınız.", "code": null, "options": {"A": "x = input(\"x:\")\ny = input(\"y:\")\nh = (x**2 + y**2)\nh = h**2\nprint('Hipotenüs:', h)", "B": "x = input(int(\"x:\"))\ny = input(int(\"y:\"))\nh = (x**2 + y**2)\nh = h**2\nprint('Hipotenüs:', h)", "C": "x = float(input(\"x kenarı için değer giriniz:\"))\ny = float(input(\"y kenarı için değer giriniz:\"))\nh = (x**2 + y**2)**0.5\nprint(\"Hipotenüs:\", h)", "D": "x = input(int(\"x kenarı için değer giriniz:\"))\ny = input(int(\"y kenarı için değer giriniz:\"))\nh = (x**2 + y**2)\nprint(\"Hipotenüs:\", h)"}, "answer": "C", "explanation": "İpucu: Hipotenüs formülü c = (x**2 + y**2)**0.5 şeklindedir ve kenar uzunlukları float(input(...)) ile sayısal olarak alınmalıdır."}, {"id": 7017, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 4, "difficulty": "Orta", "category": "Çıkmış Soru • Koşullu İfadeler (Orta #7)", "question": "Girilen sayının tek mi çift mi olduğunu bulan programı yazınız.", "code": null, "options": {"A": "sayi = input('Sayı: ')\nif (sayi % 2 == 0):\n    print(\"Sayı Çift\")\nelse:\n    print(\"Sayı Tek\")", "B": "sayi = input('Sayı: ')\nif (int(sayi) / 2 == 0):\n    print(\"Sayı Çift\")\nelse:\n    print(\"Sayı Tek\")", "C": "sayi = int(input('Sayı: '))\nif (sayi % 2 == 0):\n    print(\"Sayı Çift\")\nelse:\n    print(\"Sayı Tek\")"}, "answer": "C", "explanation": "İpucu: Kullanıcıdan alınan değer int() ile tam sayıya çevrilmeli ve % (mod) operatörü ile 2'ye bölümünden kalanın 0 olup olmadığı kontrol edilmelidir."}, {"id": 7018, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 6, "difficulty": "Orta", "category": "Çıkmış Soru • Döngüler ve Koşullar (Orta #8)", "question": "0 ve 1000 arasındaki çift olan tüm sayıların toplamını ekrana yazdıran Python kodu aşağıdakilerden hangisidir?", "code": null, "options": {"A": "sonuc = 0\nfor i in range(0, 1000):\n    if i % 2 == 0:\n        sonuc = sonuc + i\nprint(\"Sonuç:\", sonuc)", "B": "sonuc = 1\nfor i in range(0, 1000):\n    if i % 2 == 0:\n        sonuc = sonuc + 1\nprint(\"Sonuç:\", sonuc)", "C": "sonuc = 0\nfor i in range(1, 1000):\n    if i % 2 == 0:\n        sonuc = sonuc + 1\nprint(\"Sonuç:\", sonuc)", "D": "sonuc = 0\nfor i in range(0, 1000):\n    if i % 2 == 1:\n        sonuc = sonuc + 1\nprint(\"Sonuç:\", sonuc)", "E": "sonuc = 0\nfor i in range(0, 1000):\n    if i % 2 == 0:\n        print(\"Sonuç:\", sonuc)"}, "answer": "A", "explanation": "İpucu: sonuc = 0 ile başlanmalı, range(0, 1000) döngüsü içinde i % 2 == 0 şartını sağlayan her i değeri sonuc = sonuc + i ile toplanmalıdır."}, {"id": 7019, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 5, "difficulty": "Orta", "category": "Çıkmış Soru • Listeler (Orta #9)", "question": "Yukarıdaki mesaj listesinin 0'dan 2. indise kadar olan kısmını yazdıran kod hangisidir?", "code": "mesaj = [\"görsel\", \"programlama\", \"dersine\", \"hoş\", \"geldiniz\"]", "options": {"A": "print(mesaj[0, 2])", "B": "print(mesaj[0:2])", "C": "print(mesaj[2:0])", "D": "print(mesaj[0.2])", "E": "print(mesaj[0-2])"}, "answer": "B", "explanation": "İpucu: Liste dilimleme (slicing) işleminde iki nokta üst üste [başlangıç:bitiş] kullanılır: print(mesaj[0:2])."}, {"id": 7020, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 5, "difficulty": "Orta", "category": "Çıkmış Soru • Listeler (Orta #10)", "question": "Yukarıdaki kumes listesine \"civciv\" elemanını ekleyerek, ciftlik ve kumes listelerini birleştiren kod hangisidir?", "code": "ciftlik = [\"inek\", \"koyun\", \"keçi\"]\nkumes = [\"tavuk\", \"horoz\"]", "options": {"A": "ciftlik.extend(kumes)\nciftlik.append(kumes[civciv])", "B": "kumes.append(\"civciv\")\nciftlik.extend(kumes)", "C": "kumes.append(ciftlik)\nkumes.extend(\"civciv\")", "D": "ciftlik.append(kumes)\nkumes.append(\"civciv\")", "E": "kumes.extend(\"civciv\")\nkumes.append(ciftlik)"}, "answer": "B", "explanation": "İpucu: append() listeye tek bir eleman ekler (kumes.append(\"civciv\")), extend() ise bir listeyi diğer listenin sonuna ekleyerek birleştirir (ciftlik.extend(kumes))."}, {"id": 7021, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 1, "difficulty": "Zor", "category": "Çıkmış Soru • Python'a Giriş (Zor #1)", "question": "Python'da ekrana yazdırma komutlarından hangisi doğru şekilde yazılmıştır?", "code": null, "options": {"A": "print(merhaba dünya)", "B": "PRİNT(merhaba dünya)", "C": "console.log(\"merhaba dünya\")", "D": "console.log(merhaba dünya)", "E": "print(\"merhaba dünya\")"}, "answer": "E", "explanation": "İpucu: Python'da ekrana yazdırma fonksiyonu küçük harfle print() olarak yazılır ve metin (string) ifadeler tırnak içinde verilir."}, {"id": 7022, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Zor", "category": "Çıkmış Soru • Veri Tipleri (Zor #2)", "question": "Yukarıdaki Python kodunun çıktısı ne olur?", "code": "x = 5\ny = \"5\"\nz = 5.0\nprint(x + int(y))\nprint(str(x) + y)\nprint(x == z)\nprint(type(z))", "options": {"A": "10\n55\nTrue\n<class 'float'>", "B": "55\n10\nFalse\n<class 'float'>", "C": "10\n55\nFalse\n<class 'int'>", "D": "10\n10\nTrue\n<class 'float'>", "E": "55\n55\nTrue\n<class 'float'>"}, "answer": "A", "explanation": "İpucu: 5 + int('5') = 10 yapar. str(5) + '5' = '55' metin birleştirmesi yapar. 5 == 5.0 değerce eşit olduğundan True döner. z'nin tipi ise <class 'float'>'tır."}, {"id": 7023, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Zor", "category": "Çıkmış Soru • Veri Tipleri (Zor #3)", "question": "Yukarıdaki kodu çalıştırdığımızda konsolda 13 gözükmektedir. Buna göre print(?) içindeki ? yerine ne yazılmalıdır?", "code": "Sayi1 = '5'\nSayi2 = '8'\nprint(?)", "options": {"A": "Sayi1 + Sayi2", "B": "Sayi1, Sayi2", "C": "int(Sayi1) + int(Sayi2)", "D": "str(Sayi1) + str(Sayi2)", "E": "int(Sayi1) + Sayi2"}, "answer": "C", "explanation": "İpucu: String olarak tanımlanan '5' ve '8' değerlerinin matematiksel toplamının 13 olması için her ikisi de int() ile tam sayıya çevrilmelidir."}, {"id": 7024, "course": "gorsel_vize", "test_type": "Görsel Programlama I - Çıkmış Sorular", "qType": "cikmis", "week": 2, "difficulty": "Zor", "category": "Çıkmış Soru • Veri Tipleri (Zor #4)", "question": "Yukarıdaki Python kodunun çıktısı ne olu     const STORAGE_KEY_ANS = "gorsel_user_answers";

    const STORAGE_KEY_THEME = "app_theme_mode";

    // STATE
    let currentFilterType = "all";

    try {

      if (savedFavs) userFavs = new Set(JSON.parse(savedFavs));
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
      if (savedTheme === "dark" || (!savedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
        document.getElementById("btn-theme").textContent = "☀️";
      }
    } catch(e) {
      console.log("Storage load warning:", e);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_ANS, JSON.stringify(userAnswers));
        localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify([...userFavs]));
      } catch(e) {}
      updateCounters();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      document.getElementById("btn-theme").textContent = isDark ? "☀️" : "🌙";
      try { localStorage.setItem(STORAGE_KEY_THEME, isDark ? "dark" : "light"); } catch(e) {}
    }

    // TEXT NORMALIZER (TR SUPPORT)
    function normTr(str) {
      return (str || "").toString().trim().toLocaleLowerCase("tr-TR").replace(/i\u0307/g, "i").replace(/\s+/g, " ");
    }

    // FILTERS
    function setFilter(type, week = 0) {
      currentFilterType = type;
      currentFilterWeek = week;
      
      // Update UI active buttons
      const btns = document.querySelectorAll("#filters-container .filter-btn");
      btns.forEach(b => b.classList.remove("active"));
      
      event && event.target && event.target.classList.add("active");

      // Filter pool
      pool = ALL_QUESTIONS.filter(q => {
        if (type === "all") return week === 0 || q.week === week;
        if (type === "cikmis") return q.qType === "cikmis";
        if (type === "test") return q.qType === "test";
        if (type === "fill") return q.qType === "fill";
        if (type === "code") return q.qType === "code";
        if (type === "wrong") {
          const a = userAnswers[q.id];
          return a && a.status === "YANLIS";
        }
        if (type === "fav") return userFavs.has(q.id);
        if (type === "week") return q.week === week;
        return true;
      });

      if (pool.length === 0) {
        alert("Bu filtreye uygun soru bulunamadı! Tümü gösteriliyor.");
        pool = [...ALL_QUESTIONS];
      }

      currentIndex = 0;
      currentFillInput = "";
      renderQuestion();
      updateCounters();
    }

    function updateCounters() {
      let wrongCount = 0;
      let correctCount = 0;
      let answeredCount = 0;

      ALL_QUESTIONS.forEach(q => {
        const a = userAnswers[q.id];
        if (a) {
          answeredCount++;
          if (a.status === "DOGRU") correctCount++;
          else if (a.status === "YANLIS") wrongCount++;
        }
      });

      document.getElementById("wrong-count").textContent = wrongCount;
      document.getElementById("fav-count").textContent = userFavs.size;
      document.getElementById("modal-correct-cnt").textContent = correctCount;
      document.getElementById("modal-wrong-cnt").textContent = wrongCount;
      document.getElementById("modal-unanswered-cnt").textContent = ALL_QUESTIONS.length - answeredCount;

      const pct = Math.round((answeredCount / ALL_QUESTIONS.length) * 100);
      document.getElementById("progress-bar").style.width = pct + "%";
    }

    // RENDER QUESTION
    function renderQuestion() {
      const q = pool[currentIndex];

      const isFav = userFavs.has(q.id);

      document.getElementById("header-counter").textContent = (currentIndex + 1) + " / " + pool.length;
      const btnFav = document.getElementById("btn-fav");
      if (isFav) btnFav.classList.add("active");
      else btnFav.classList.remove("active");

      let typeBadge = "";

      else if (q.difficulty === "Orta") diffBadge = '<span class="badge" style="background:#eff6ff; color:#1d4ed8;">Orta</span>';
      else if (q.difficulty === "Zor") diffBadge = '<span class="badge" style="background:#fef2f2; color:#b91c1c;">Zor</span>';

      let codeHtml = "";

            </div>
            <pre><code>${escapeHtml(q.code)}</code></pre>
          </div>
        `;
      }

      let interactiveHtml = "";

      // 1. TEST & ÇIKMIŞ SORULAR
      if (q.qType === "test" || q.qType === "cikmis") {
        let optsHtml = "";

          let cls = "";
          let iconChar = key;
          if (isAnswered) {
            if (key === q.answer) {
              cls = "correct";
              iconChar = "✓";
            } else if (key === ansObj.selected) {
              cls = "wrong";
              iconChar = "✗";
            }
          }
          optsHtml += `
            <button class="option-btn ${cls}" onclick="answerTest('${key}')" ${isAnswered ? 'disabled' : ''}>

') ? 'white-space:pre-wrap; font-family:Consolas,Monaco,monospace; font-size:12px;' : ''}">${escapeHtml(val)}</span>
            </button>
          `;
        }
        interactiveHtml = `<div class="options-list">${optsHtml}</div>`;

        if (isAnswered) {
          const isOk = ansObj.status === "DOGRU";
          interactiveHtml += `
            <div class="explanation-box ${isOk ? 'success' : 'danger'}">

            </div>

        } else {

          interactiveHtml = `
            <div class="explanation-box ${isOk ? 'success' : 'danger'}">

            <div class="btn-row">
              <button class="btn btn-primary" onclick="submitCodeAnswer()">Kodu Kontrol Et & Çözümü Gör</button>
              <button class="btn btn-secondary" onclick="revealCodeAnswer()">Resmi Çözümü Aç</button>

        if (isAnswered) {

      card.innerHTML = `

      // Scroll card to top smoothly

    // ACTIONS
    function answerTest(key) {
      const q = pool[currentIndex];
      const isOk = key === q.answer;
      userAnswers[q.id] = {
        status: isOk ? "DOGRU" : "YANLIS",
        selected: key
      };
      saveState();
      renderQuestion();
    }

    function submitFillAnswer() {
      const q = pool[currentIndex];
      const input = document.getElementById("fill-input-field");
      const userClean = normTr(input ? input.value : "");
      if (!userClean) return;

      const isOk = (q.accepted || []).some(acc => {
        const c = normTr(acc);
        return c === userClean || userClean.includes(c);
      });

      userAnswers[q.id] = {
        status: isOk ? "DOGRU" : "YANLIS",
        text: input.value
      };
      currentFillInput = "";
      saveState();
      renderQuestion();
    }

    function revealFillAnswer() {
      const q = pool[currentIndex];
      userAnswers[q.id] = {
        status: "DOGRU",
        text: q.official_answer
      };
      saveState();
      renderQuestion();
    }

      if (box) box.style.display = box.style.display === "none" ? "block" : "none";
    }

      const q = pool[currentIndex];

      const matched = (q.keywords || []).filter(kw => txtClean.includes(kw.toLowerCase()));
      const isOk = matched.length >= Math.ceil((q.keywords || []).length * 0.5);

      userAnswers[q.id] = {
        status: isOk ? "DOGRU" : "YANLIS",
        text: txt
      };
      saveState();
      renderQuestion();
    }

      const q = pool[currentIndex];
      userAnswers[q.id] = {
        status: "DOGRU",
        text: q.solution_code
      };
      saveState();
      renderQuestion();
    }

    function rateCode(status) {
      const q = pool[currentIndex];
      if (userAnswers[q.id]) {
        userAnswers[q.id].status = status;
        saveState();
        renderQuestion();
      }
    }

    function resetCurrentQuestion() {
      const q = pool[currentIndex];
      delete userAnswers[q.id];
      currentFillInput = "";
      saveState();
      renderQuestion();
    }

    function resetAllAnswers() {
      if (confirm("Tüm verdiğiniz cevaplar sıfırlansın mı?")) {
        userAnswers = {};
        saveState();
        closeGridModal();
        renderQuestion();
      }
    }

    function toggleFav() {
      const q = pool[currentIndex];
      if (userFavs.has(q.id)) userFavs.delete(q.id);
      else userFavs.add(q.id);
      saveState();
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIndex < pool.length - 1) {
        currentIndex++;
        currentFillInput = "";
        renderQuestion();
      } else {
        alert("Bu bölümdeki son soruya geldiniz!");
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        currentFillInput = "";
        renderQuestion();
      }
    }

    // MODAL GRID DRAWER
    function openGridModal() {
      const overlay = document.getElementById("modal-overlay");
      const grid = document.getElementById("modal-grid");
      grid.innerHTML = "";

      pool.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "q-jump-btn";
        if (idx === currentIndex) btn.classList.add("current");

        const ans = userAnswers[q.id];
        if (ans) {
          if (ans.status === "DOGRU") btn.classList.add("correct");
          else if (ans.status === "YANLIS") btn.classList.add("wrong");
        }

        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          currentFillInput = "";
          closeGridModal();
          renderQuestion();
        };
        grid.appendChild(btn);
      });

      overlay.style.display = "block";
    }

    function closeGridModal(e) {
      document.getElementById("modal-overlay").style.display = "none";
    }

    // UTILITIES
    function copyCode(btn, encoded) {
      const text = decodeURIComponent(encoded);
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.textContent;
        btn.textContent = "Kopyalandı!";
        setTimeout(() => btn.textContent = oldText, 1500);
      });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // INITIAL RENDER
    renderQuestion();
    updateCounters();
  </script>
</body>
</html>
