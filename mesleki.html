<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mesleki Yabancı Dil - Mobil Sınav Portalı</title>
  <style>
    /* Safe-fallback polyfill for localStorage in mobile WebView or file:// */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #0f172a;
      --code-text: #f1f5f9;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
      --correct-border: #a7f3d0;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --wrong-border: #fecaca;
    }
    .dark {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --code-bg: #050811;
      --code-text: #e2e8f0;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: rgba(16, 185, 129, 0.4);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --wrong-border: rgba(244, 63, 94, 0.4);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      overflow-x: hidden;
      padding-bottom: 90px;
    }
    /* Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      backdrop-filter: blur(10px);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .title-box .icon {
      font-size: 22px;
      line-height: 1;
    }
    .title-box h1 {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      background: var(--border);
      color: var(--text);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .progress-pill {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.2);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }
    /* Filters Container */
    .filters-wrap {
      padding: 8px 12px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 6px;
    }
    .filters-wrap::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    /* Main Content */
    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-week { background: #e0e7ff; color: #3730a3; }
    .badge-test { background: #dbeafe; color: #1e40af; }
    .badge-fill { background: #d1fae5; color: #065f46; }
    .badge-code { background: #fef3c7; color: #92400e; }
    .badge-fav { background: #fef08a; color: #854d0e; cursor: pointer; }
    .dark .badge-week { background: #312e81; color: #c7d2fe; }
    .dark .badge-test { background: #1e3a8a; color: #bfdbfe; }
    .dark .badge-fill { background: #064e3b; color: #a7f3d0; }
    .dark .badge-code { background: #78350f; color: #fde68a; }

    .q-text {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 14px;
    }
    /* Options for Test */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
    }
    .option-btn:active {
      transform: scale(0.99);
    }
    .opt-key {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .opt-text {
      flex: 1;
      line-height: 1.4;
    }
    .option-btn.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #065f46;
    }
    .dark .option-btn.correct {
      color: #6ee7b7;
    }
    .option-btn.correct .opt-key {
      background: var(--correct);
      color: #fff;
    }
    .option-btn.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #991b1b;
    }
    .dark .option-btn.wrong {
      color: #fca5a5;
    }
    .option-btn.wrong .opt-key {
      background: var(--wrong);
      color: #fff;
    }
    /* Explanation Box */
    .explanation-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }
    .explanation-box.success {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #065f46;
    }
    .dark .explanation-box.success {
      color: #6ee7b7;
    }
    .explanation-box.danger {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: #991b1b;
    }
    .dark .explanation-box.danger {
      color: #fca5a5;
    }
    /* Fill-in-the-blank styling */
    .fill-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fill-input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      outline: none;
    }
    .fill-input:focus {
      border-color: var(--primary);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    /* Fixed Bottom Nav */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 680px;
      margin: 0 auto;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      min-height: 44px;
    }
    .nav-btn.prev {
      background: var(--border);
      color: var(--text);
    }
    .nav-btn.next {
      background: var(--primary);
      color: #fff;
    }
    .nav-btn.fav {
      flex: 0 0 44px;
      background: var(--border);
      color: var(--text-muted);
      font-size: 18px;
    }
    .nav-btn.fav.active {
      background: #fef08a;
      color: #ca8a04;
    }
    .dark .nav-btn.fav.active {
      background: #854d0e;
      color: #fef08a;
    }
    /* Question Jump Drawer / Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      padding: 4px 0;
    }
    .q-jump-btn {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .q-jump-btn.current {
      border: 2px solid var(--primary);
    }
    .q-jump-btn.correct {
      background: var(--correct);
      color: #fff;
      border-color: var(--correct);
    }
    .q-jump-btn.wrong {
      background: var(--wrong);
      color: #fff;
      border-color: var(--wrong);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- SAFE LOCALSTORAGE POLYFILL FOR MOBILE (PREVENTS WHITE SCREEN ON FILE://) -->
  <script>
    (function() {
      try {
        var test = '__st_test__';
        window.localStorage.setItem(test, test);
        window.localStorage.removeItem(test);
      } catch(e) {
        console.warn('Storage sandboxed or file:// active. Polyfilling memory storage.');
        var mem = {};
        window.localStorage = {
          getItem: function(k) { return mem.hasOwnProperty(k) ? mem[k] : null; },
          setItem: function(k, v) { mem[k] = String(v); },
          removeItem: function(k) { delete mem[k]; },
          clear: function() { mem = {}; }
        };
      }
    })();
  </script>

  <!-- TOP HEADER -->
  <header>
    <div class="header-row">
      <div class="title-box">
        <span class="icon">🌍</span>
        <div>
          <h1>Mesleki Yabancı Dil</h1>
          <div style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Technical English Vize Sınavı (93 Soru)</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="progress-pill" id="btn-jump-modal" onclick="openGridModal()">
          <span id="header-counter">1 / 93</span>
          <span>▾</span>
        </button>
        <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" title="Karanlık/Aydınlık Mod">🌙</button>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </header>

  <!-- FILTER PILLS -->
  <div class="filters-wrap" id="filters-container">
    <button class="filter-btn active" onclick="setFilter('all', 0)">Tümü (93)</button>
    <button class="filter-btn" onclick="setFilter('test', 0)">Test (62)</button>
    <button class="filter-btn" onclick="setFilter('fill', 0)">Boşluk (31)</button>
    <button class="filter-btn" onclick="setFilter('wrong', 0)">✗ Yanlışlarım (<span id="wrong-count">0</span>)</button>
    <button class="filter-btn" onclick="setFilter('fav', 0)">⭐ Favoriler (<span id="fav-count">0</span>)</button>
    <span style="display:inline-block; width:1px; height:18px; background:var(--border); margin:auto 4px;"></span>
    <button class="filter-btn" onclick="setFilter('week', 1)">1.1 Vocab Test (30)</button>
    <button class="filter-btn" onclick="setFilter('week', 2)">1.2 Phrasal Verbs Test (32)</button>
    <button class="filter-btn" onclick="setFilter('week', 3)">2.1 Phrasal Verbs Boşluk (16)</button>
    <button class="filter-btn" onclick="setFilter('week', 4)">2.2 Vocab Boşluk (15)</button>
  </div>

  <!-- MAIN QUESTION DISPLAY -->
  <main id="app">
    <div class="card" id="q-card">
      <!-- Dynamic Question Content Injected by JS -->
    </div>
  </main>

  <!-- FIXED BOTTOM NAVIGATION -->
  <footer>
    <button class="nav-btn prev" onclick="prevQuestion()">◄ Önceki</button>
    <button class="nav-btn fav" id="btn-fav" onclick="toggleFav()" title="Favoriye Ekle">⭐</button>
    <button class="nav-btn next" onclick="nextQuestion()">Sonraki ►</button>
  </footer>

  <!-- QUESTION SELECTION MODAL (DRAWER) -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeGridModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">Sorular Listesi</div>
        <button class="btn-icon" onclick="closeGridModal()">✕</button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); display:flex; gap:12px; flex-wrap:wrap;">
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--correct);"></span> Doğru: <strong id="modal-correct-cnt">0</strong></span>
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--wrong);"></span> Yanlış: <strong id="modal-wrong-cnt">0</strong></span>
        <span style="display:flex; align-items:center; gap:4px;"><span style="width:10px; height:10px; border-radius:3px; background:var(--bg); border:1px solid var(--border);"></span> Çözülmedi: <strong id="modal-unanswered-cnt">93</strong></span>
      </div>
      <div class="grid-container" id="modal-grid">
        <!-- Injected by JS -->
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="resetAllAnswers()">Cevapları Sıfırla</button>
        <button class="btn btn-primary" style="flex:1;" onclick="closeGridModal()">Kapat</button>
      </div>
    </div>
  </div>

l: A built-in numerical data type representing numbers with a decimal point. General: To stay/move on the surface of a liquid or drift in the air."}, {"id": 7087, "course": "mesleki_vize", "lang": "en", "week": 4, "week_title": "2.2 Core Vocabulary Fill-in-the-Blank", "qType": "fill", "subType": "vocab_fill", "difficulty": "Boşluk Doldurma", "test_type": "Mesleki Yabancı Dil - Vocabulary Fill-in-the-Blank", "category": "2.2 Core Vocabulary Fill-in-the-Blank (Q9)", "question": "The function expects a string ________, but an integer was provided.", "code": null, "answer": "DOGRU", "official_answer": "argument", "accepted": ["argument"], "hint_extra": "Technical Meaning: An actual value, variable, or expression passed into a function or method upon invocation", "explanation": "Answer: \"argument\" (Argument). Technical: An actual value, variable, or expression passed into a function or method upon invocation. General: An exchange of diverging or opposite views."}, {"id": 7088, "course": "mesleki_vize", "lang": "en", "week": 4, "week_title": "2.2 Core Vocabulary Fill-in-the-Blank", "qType": "fill", "subType": "vocab_fill", "difficulty": "Boşluk Doldurma", "test_type": "Mesleki Yabancı Dil - Vocabulary Fill-in-the-Blank", "category": "2.2 Core Vocabulary Fill-in-the-Blank (Q10)", "question": "A while ________ continues execution as long as the boolean expression evaluates to True.", "code": null, "answer": "DOGRU", "official_answer": "loop", "accepted": ["loop"], "hint_extra": "Technical Meaning: A control flow structure designed to repeatedly execute a targeted block of instructions until a condition changes", "explanation": "Answer: \"loop\" (Loop). Technical: A control flow structure designed to repeatedly execute a targeted block of instructions until a condition changes. General: A curved shape produced by a curve bending around and crossing itself."}, {"id": 7089, "course": "mesleki_vize", "lang": "en", "week": 4, "week_title": "2.2 Core Vocabulary Fill-in-the-Blan  null, "answer": "DOGRU", "official_answer": "stack", "accepted": ["stack"], "hint_extra": "Technical Meaning: A Last-In, First-Out (LIFO) data structure, or a combination of programming languages/frameworks used to build an application", "explanation": "Answer: \"stack\" (Stack). Technical: A Last-In, First-Out (LIFO) data structure, or a combination of programming languages/frameworks used to build an application. General: A neat pile of objects placed one on top of the other."}, {"id": 7092, "course": "mesleki_vize", "lang": "en", "week": 4, "week_title": "2.2 Core Vocabulary Fill-in-the-Blank", "qType": "fill", "subType": "vocab_fill", "difficulty": "Boşluk Doldurma", "test_type": "Mesleki Yabancı Dil - Vocabulary Fill-in-the-Blank", "category": "2.2 Core Vocabulary Fill-in-the-Blank (Q14)", "question": "You can ________ the original repository on GitHub to make custom modifications without affecting the main project.", "code": null, "answer": "DOGRU", "official_answer": "fork", "accepted": ["fork"], "hint_extra": "Technical Meaning: To create an independent copy of an open-source code repository, or a system call creating a child process", "explanation": "Answer: \"fork\" (Fork). Technical: To create an independent copy of an open-source code repository, or a system call creating a child process. General: An eating utensil with prongs, or a place where a road/river divides."}, {"id": 7093, "course": "mesleki_vize", "lang": "en", "week": 4, "week_title": "2.2 Core Vocabulary Fill-in-the-Blank", "qType": "fill", "subType": "vocab_fill", "difficulty": "Boşluk Doldurma", "test_type": "Mesleki Yabancı Dil - Vocabulary Fill-in-the-Blank", "category": "2.2 Core Vocabulary Fill-in-the-Blank (Q15)", "question": "Websites use session ________ to keep users logged in while navigating between different pages.", "code": null, "answer": "DOGRU", "official_answer": "cookies", "accepted": ["cookies", "cookie"], "hint_extra": "Technical Meaning: A small piece of data stored on the user's web browser by the server to remember state, sessions, or preferences", "explanation": "Answer: \"cookies\" (Cookie). Technical: A small piece of data stored on the user's web browser by the server to remember state, sessions, or preferences. General: A small, sweet baked snack."}];
    const STORAGE_KEY_ANS = "mesleki_user_answers";
    const STORAGE_KEY_FAV = "mesleki_user_favs";
    const STORAGE_KEY_THEME = "app_theme_mode";

    let currentFilterType = "all";
    let currentFilterWeek = 0;
    let pool = [...ALL_QUESTIONS];
    let currentIndex = 0;
    let userAnswers = {};
    let userFavs = new Set();
    let currentFillInput = "";

    try {
      const savedAns = localStorage.getItem(STORAGE_KEY_ANS);
      if (savedAns) userAnswers = JSON.parse(savedAns);
      const savedFavs = localStorage.getItem(STORAGE_KEY_FAV);
      if (savedFavs) userFavs = new Set(JSON.parse(savedFavs));
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
      if (savedTheme === "dark" || (!savedTheme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
        document.getElementById("btn-theme").textContent = "☀️";
      }
    } catch(e) {
      console.log("Storage load warning:", e);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_ANS, JSON.stringify(userAnswers));
        localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify([...userFavs]));
      } catch(e) {}
      updateCounters();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      document.getElementById("btn-theme").textContent = isDark ? "☀️" : "🌙";
      try { localStorage.setItem(STORAGE_KEY_THEME, isDark ? "dark" : "light"); } catch(e) {}
    }

    function normTr(str) {
      return (str || "").toString().trim().toLocaleLowerCase("tr-TR").replace(/i\u0307/g, "i").replace(/\s+/g, " ");
    }

    function setFilter(type, week = 0) {
      currentFilterType = type;
      currentFilterWeek = week;

      const btns = document.querySelectorAll("#filters-container .filter-btn");
      btns.forEach(b => b.classList.remove("active"));
      event && event.target && event.target.classList.add("active");

      pool = ALL_QUESTIONS.filter(q => {
        if (type === "all") return week === 0 || q.week === week;
        if (type === "test") return q.qType === "test";
        if (type === "fill") return q.qType === "fill";
        if (type === "wrong") {
          const a = userAnswers[q.id];
          return a && a.status === "YANLIS";
        }
        if (type === "fav") return userFavs.has(q.id);
        if (type === "week") return q.week === week;
        return true;
      });

      if (pool.length === 0) {
        alert("Bu filtreye uygun soru bulunamadı! Tümü gösteriliyor.");
        pool = [...ALL_QUESTIONS];
      }

      currentIndex = 0;
      currentFillInput = "";
      renderQuestion();
      updateCounters();
    }

    function updateCounters() {
      let wrongCount = 0;
      let correctCount = 0;
      let answeredCount = 0;

      ALL_QUESTIONS.forEach(q => {
        const a = userAnswers[q.id];
        if (a) {
          answeredCount++;
          if (a.status === "DOGRU") correctCount++;
          else if (a.status === "YANLIS") wrongCount++;
        }
      });

      document.getElementById("wrong-count").textContent = wrongCount;
      document.getElementById("fav-count").textContent = userFavs.size;
      document.getElementById("modal-correct-cnt").textContent = correctCount;
      document.getElementById("modal-wrong-cnt").textContent = wrongCount;
      document.getElementById("modal-unanswered-cnt").textContent = ALL_QUESTIONS.length - answeredCount;

      const pct = Math.round((answeredCount / ALL_QUESTIONS.length) * 100);
      document.getElementById("progress-bar").style.width = pct + "%";
    }

    function renderQuestion() {
      const q = pool[currentIndex];
      if (!q) return;

      const card = document.getElementById("q-card");
      const ansObj = userAnswers[q.id];
      const isAnswered = ansObj !== undefined;
      const isFav = userFavs.has(q.id);

      document.getElementById("header-counter").textContent = (currentIndex + 1) + " / " + pool.length;
      const btnFav = document.getElementById("btn-fav");
      if (isFav) btnFav.classList.add("active");
      else btnFav.classList.remove("active");

      let typeBadge = "";
      if (q.qType === "test") typeBadge = '<span class="badge badge-test">TEST SORUSU</span>';
      else if (q.qType === "fill") typeBadge = '<span class="badge badge-fill">BOŞLUK DOLDURMA</span>';

      const weekLabels = {
        1: "1.1 Vocab Test",
        2: "1.2 Phrasal Test",
        3: "2.1 Phrasal Boşluk",
        4: "2.2 Vocab Boşluk"
      };

      let interactiveHtml = "";

      if (q.qType === "test") {
        let optsHtml = "";
        for (const [key, val] of Object.entries(q.options || {})) {
          let cls = "";
          let iconChar = key;
          if (isAnswered) {
            if (key === q.answer) {
              cls = "correct";
              iconChar = "✓";
            } else if (key === ansObj.selected) {
              cls = "wrong";
              iconChar = "✗";
            }
          }
          optsHtml += `
            <button class="option-btn ${cls}" onclick="answerTest('${key}')" ${isAnswered ? 'disabled' : ''}>
              <span class="opt-key">${iconChar}</span>
              <span class="opt-text">${escapeHtml(val)}</span>
            </button>
          `;
        }
        interactiveHtml = `<div class="options-list">${optsHtml}</div>`;

        if (isAnswered) {
          const isOk = ansObj.status === "DOGRU";
          interactiveHtml += `
            <div class="explanation-box ${isOk ? 'success' : 'danger'}">
              <div style="font-weight:800; margin-bottom:4px;">${isOk ? '✓ Tebrikler! Doğru Cevap' : '✗ Yanlış Cevap!'}</div>
              <div><strong>Doğru Cevap:</strong> ${q.answer} seçeneğidir (${escapeHtml(q.options[q.answer])}).</div>
              <div style="margin-top:6px; opacity:0.95;">${escapeHtml(q.explanation)}</div>
              <button class="btn btn-secondary" style="margin-top:10px; font-size:12px; padding:6px 10px;" onclick="resetCurrentQuestion()">Tekrar Dene</button>
            </div>
          `;
        }
      } else if (q.qType === "fill") {
        if (!isAnswered) {
          interactiveHtml = `
            <div class="fill-box">
              <input type="text" id="fill-input-field" class="fill-input" 
                placeholder="Boşluğa gelecek cevabı yazın..." 
                value="${escapeHtml(currentFillInput)}" 
                autocapitalize="none" autocorrect="off" spellcheck="false"
                onkeydown="if(event.key==='Enter') submitFillAnswer()">
              <div class="btn-row">
                <button class="btn btn-primary" onclick="submitFillAnswer()">Kontrol Et</button>
                <button class="btn btn-secondary" onclick="revealFillAnswer()">Cevabı Göster</button>
                <button class="btn btn-secondary" onclick="toggleFillHint()">💡 İpucu</button>
              </div>
              <div id="fill-hint-box" style="display:none; font-size:12px; background:rgba(79,70,229,0.1); color:var(--primary); padding:8px 12px; border-radius:8px; font-weight:600;">
                İlk karakter: "${q.official_answer[0]}" • Uzunluk: ${q.official_answer.length} karakter${q.hint_extra ? ` • ${escapeHtml(q.hint_extra)}` : ''}
              </div>
            </div>
          `;
        } else {
          const isOk = ansObj.status === "DOGRU";
          interactiveHtml = `
            <div class="explanation-box ${isOk ? 'success' : 'danger'}">
              <div style="font-weight:800; margin-bottom:4px;">${isOk ? '✓ Doğru Bildiniz!' : '✗ Yanlış / Eksik!'}</div>
              <div style="margin-bottom:4px;"><strong>Sizin Cevabınız:</strong> <span style="font-family:monospace;">${escapeHtml(ansObj.text || "(Boş bırakıldı)")}</span></div>
              <div style="margin-bottom:4px;"><strong>Resmi Doğru Cevap:</strong> <span style="font-family:monospace; font-weight:800;">${escapeHtml(q.official_answer)}</span></div>
              <div style="margin-top:6px; opacity:0.95;">${escapeHtml(q.explanation)}</div>
              <button class="btn btn-secondary" style="margin-top:10px; font-size:12px; padding:6px 10px;" onclick="resetCurrentQuestion()">Tekrar Dene</button>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="q-meta">
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="badge badge-week">${weekLabels[q.week] || (q.week + '. Bölüm')}</span>
            ${typeBadge}
          </div>
          <span style="font-size:11px; color:var(--text-muted); font-weight:600;">#${q.id} • ${escapeHtml(q.category)}</span>
        </div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        ${interactiveHtml}
      `;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function answerTest(key) {
      const q = pool[currentIndex];
      const isOk = key === q.answer;
      userAnswers[q.id] = {
        status: isOk ? "DOGRU" : "YANLIS",
        selected: key
      };
      saveState();
      renderQuestion();
    }

    function submitFillAnswer() {
      const q = pool[currentIndex];
      const input = document.getElementById("fill-input-field");
      const userClean = normTr(input ? input.value : "");
      if (!userClean) return;

      const isOk = (q.accepted || []).some(acc => {
        const c = normTr(acc);
        return c === userClean || userClean.includes(c);
      });

      userAnswers[q.id] = {
        status: isOk ? "DOGRU" : "YANLIS",
        text: input.value
      };
      currentFillInput = "";
      saveState();
      renderQuestion();
    }

    function revealFillAnswer() {
      const q = pool[currentIndex];
      userAnswers[q.id] = {
        status: "DOGRU",
        text: q.official_answer
      };
      saveState();
      renderQuestion();
    }

    function toggleFillHint() {
      const box = document.getElementById("fill-hint-box");
      if (box) box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function resetCurrentQuestion() {
      const q = pool[currentIndex];
      delete userAnswers[q.id];
      currentFillInput = "";
      saveState();
      renderQuestion();
    }

    function resetAllAnswers() {
      if (confirm("Tüm verdiğiniz cevaplar sıfırlansın mı?")) {
        userAnswers = {};
        saveState();
        closeGridModal();
        renderQuestion();
      }
    }

    function toggleFav() {
      const q = pool[currentIndex];
      if (userFavs.has(q.id)) userFavs.delete(q.id);
      else userFavs.add(q.id);
      saveState();
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIndex < pool.length - 1) {
        currentIndex++;
        currentFillInput = "";
        renderQuestion();
      } else {
        alert("Bu bölümdeki son soruya geldiniz!");
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        currentFillInput = "";
        renderQuestion();
      }
    }

    function openGridModal() {
      const overlay = document.getElementById("modal-overlay");
      const grid = document.getElementById("modal-grid");
      grid.innerHTML = "";

      pool.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "q-jump-btn";
        if (idx === currentIndex) btn.classList.add("current");

        const ans = userAnswers[q.id];
        if (ans) {
          if (ans.status === "DOGRU") btn.classList.add("correct");
          else if (ans.status === "YANLIS") btn.classList.add("wrong");
        }

        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          currentFillInput = "";
          closeGridModal();
          renderQuestion();
        };
        grid.appendChild(btn);
      });

      overlay.style.display = "block";
    }

    function closeGridModal(e) {
      document.getElementById("modal-overlay").style.display = "none";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    renderQuestion();
    updateCounters();
  </script>
</body>
